/* ==========================================================================
   ROTA SINGULAR | STUDIO — Design Tokens
   Paleta institucional: Azul, Rosa, Amarelo, Lilás, Cinza claro, Branco.
   Tipografia: Sora (display) + Inter (UI/corpo) + JetBrains Mono (dados).
   ========================================================================== */

:root {
  /* --- Paleta institucional --- */
  --rs-blue: #3D5AFE;
  --rs-blue-soft: #E8ECFF;
  --rs-pink: #FF6FA0;
  --rs-pink-soft: #FFE9F1;
  --rs-yellow: #FFB937;
  --rs-yellow-soft: #FFF3DC;
  --rs-lilac: #9B7BF0;
  --rs-lilac-soft: #EFE8FF;
  --rs-gray-light: #F5F6FA;
  --rs-white: #FFFFFF;

  /* --- Neutros / texto --- */
  --rs-ink: #14171F;
  --rs-ink-soft: #5B5F6D;
  --rs-ink-faint: #9296A3;
  --rs-border: #E7E8EF;
  --rs-border-soft: #F0F1F6;

  /* --- Cor de acento ativa (trocada via data-accent em runtime) --- */
  --rs-accent: var(--rs-blue);
  --rs-accent-soft: var(--rs-blue-soft);

  /* --- Tipografia --- */
  --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  /* --- Espaçamento / raio / sombra --- */
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --shadow-soft: 0 1px 2px rgba(20, 23, 31, 0.04), 0 8px 24px rgba(20, 23, 31, 0.06);
  --shadow-lift: 0 4px 10px rgba(20, 23, 31, 0.06), 0 16px 40px rgba(20, 23, 31, 0.10);

  --nav-w: 244px;
  --topbar-h: 68px;
}

[data-accent="blue"]  { --rs-accent: var(--rs-blue);  --rs-accent-soft: var(--rs-blue-soft); }
[data-accent="pink"]  { --rs-accent: var(--rs-pink);  --rs-accent-soft: var(--rs-pink-soft); }
[data-accent="yellow"]{ --rs-accent: var(--rs-yellow); --rs-accent-soft: var(--rs-yellow-soft); }
[data-accent="lilac"] { --rs-accent: var(--rs-lilac); --rs-accent-soft: var(--rs-lilac-soft); }

* { box-sizing: border-box; }

html, body {
  height: 100%;
}

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--rs-ink);
  background: var(--rs-gray-light);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}

p { margin: 0; }

/* ==========================================================================
   Shell: sidebar + topbar + conteúdo
   ========================================================================== */

#app-shell {
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
}

.rs-sidebar {
  width: var(--nav-w);
  flex-shrink: 0;
  background: var(--rs-white);
  border-right: 1px solid var(--rs-border-soft);
  display: flex;
  flex-direction: column;
  padding: 22px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  z-index: 20;
}

.rs-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 22px;
}

.rs-brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  flex-shrink: 0;
  object-fit: cover;
  background: #000;
}

.rs-wordmark {
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: -0.01em;
  color: var(--rs-ink);
}
.rs-wordmark-bold { font-weight: 800; }
.rs-wordmark-italic { font-style: italic; font-weight: 500; }

.rs-brand-text { line-height: 1.15; overflow: hidden; }
.rs-brand-text strong { display: block; font-family: var(--font-display); font-size: 14.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rs-brand-text span { display: block; font-size: 11.5px; color: var(--rs-ink-faint); white-space: nowrap; }

.rs-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }

.rs-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  color: var(--rs-ink-soft);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  transition: background 0.15s ease, color 0.15s ease;
}

.rs-nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

.rs-nav-item:hover { background: var(--rs-gray-light); color: var(--rs-ink); }

.rs-nav-item.is-active {
  background: var(--rs-accent-soft);
  color: var(--rs-ink);
  font-weight: 600;
}

.rs-nav-spacer { flex: 1; }

.rs-nav-foot {
  border-top: 1px solid var(--rs-border-soft);
  padding-top: 14px;
  margin-top: 8px;
  text-align: center;
}
.rs-powered-caption {
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--rs-ink-faint);
  margin-bottom: 8px;
}
.rs-powered-box {
  background: var(--rs-white);
  border: 1px solid var(--rs-border-soft);
  border-radius: 12px;
  padding: 8px 10px;
  display: inline-block;
  max-width: 100%;
}
.rs-powered-logo {
  display: block;
  max-width: 100%;
  height: auto;
}

.rs-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.rs-topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  background: rgba(245, 246, 250, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 15;
  border-bottom: 1px solid transparent;
}

.rs-topbar-title { font-size: 20px; font-weight: 650; font-family: var(--font-display); }
.rs-topbar-sub { font-size: 12.5px; color: var(--rs-ink-faint); margin-top: 2px; }

.rs-menu-toggle {
  display: none;
  border: none;
  background: var(--rs-white);
  width: 38px;
  height: 38px;
  border-radius: 10px;
  box-shadow: var(--shadow-soft);
  align-items: center;
  justify-content: center;
}

.rs-content {
  padding: 24px 28px 64px;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}

/* ==========================================================================
   Componentes genéricos
   ========================================================================== */

.rs-card {
  background: var(--rs-white);
  border: 1px solid var(--rs-border-soft);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: 20px;
}

.rs-card-flat {
  background: var(--rs-white);
  border: 1px solid var(--rs-border-soft);
  border-radius: var(--radius-md);
  padding: 16px 18px;
}

.rs-grid { display: grid; gap: 16px; }
.rs-grid-4 { grid-template-columns: repeat(4, 1fr); }
.rs-grid-3 { grid-template-columns: repeat(3, 1fr); }
.rs-grid-2 { grid-template-columns: repeat(2, 1fr); }

.rs-stat {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-lg);
  padding: 18px 18px 16px;
  background: var(--rs-white);
  border: 1px solid var(--rs-border-soft);
  box-shadow: var(--shadow-soft);
}

.rs-stat::before {
  content: "";
  position: absolute;
  width: 120px; height: 120px;
  right: -40px; top: -40px;
  border-radius: 50%;
  background: var(--stat-color, var(--rs-blue));
  opacity: 0.12;
  filter: blur(2px);
}

.rs-stat-label { font-size: 12.5px; color: var(--rs-ink-soft); font-weight: 500; display: flex; align-items: center; gap: 7px; }
.rs-stat-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--stat-color, var(--rs-blue)); }
.rs-stat-value { font-family: var(--font-display); font-size: 30px; font-weight: 650; margin-top: 10px; letter-spacing: -0.02em; }
.rs-stat-foot { font-size: 12px; color: var(--rs-ink-faint); margin-top: 4px; }

.rs-section-title {
  font-size: 15.5px;
  font-weight: 650;
  font-family: var(--font-display);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.rs-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: none;
  border-radius: 12px;
  padding: 10px 16px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  white-space: nowrap;
}
.rs-btn:active { transform: scale(0.97); }

.rs-btn-primary { background: var(--rs-accent); color: white; box-shadow: 0 6px 16px rgba(20, 23, 31, 0.22); }
.rs-btn-primary:hover { filter: brightness(1.04); }

.rs-btn-ghost { background: var(--rs-white); color: var(--rs-ink); border: 1px solid var(--rs-border); }
.rs-btn-ghost:hover { background: var(--rs-gray-light); }

.rs-btn-subtle { background: var(--rs-gray-light); color: var(--rs-ink-soft); }
.rs-btn-subtle:hover { background: var(--rs-border-soft); }

.rs-btn-danger { background: #FFF0F0; color: #D64545; }

.rs-btn-icon { padding: 8px; border-radius: 10px; }

.rs-btn svg { width: 15px; height: 15px; }

.rs-input, .rs-select, .rs-textarea {
  width: 100%;
  border: 1px solid var(--rs-border);
  background: var(--rs-white);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13.5px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.rs-input:focus, .rs-select:focus, .rs-textarea:focus {
  border-color: var(--rs-accent);
  box-shadow: 0 0 0 3px var(--rs-accent-soft);
  outline: none;
}
.rs-textarea { resize: vertical; min-height: 72px; font-family: var(--font-body); }

.rs-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.rs-field label { font-size: 12.5px; font-weight: 600; color: var(--rs-ink-soft); }
.rs-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.rs-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 650;
  padding: 3px 9px;
  border-radius: 999px;
}
.rs-badge-blue   { background: var(--rs-blue-soft);  color: #2439B5; }
.rs-badge-pink   { background: var(--rs-pink-soft);  color: #C23E70; }
.rs-badge-yellow { background: var(--rs-yellow-soft);color: #9A6A00; }
.rs-badge-lilac  { background: var(--rs-lilac-soft); color: #6540C9; }
.rs-badge-gray   { background: var(--rs-gray-light); color: var(--rs-ink-soft); }

.rs-empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--rs-ink-faint);
}
.rs-empty svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: 0.5; }
.rs-empty p { font-size: 13.5px; margin-bottom: 14px; }

.rs-list-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 6px;
  border-bottom: 1px solid var(--rs-border-soft);
  cursor: pointer;
  border-radius: 10px;
  transition: background 0.12s ease;
}
.rs-list-row:hover { background: var(--rs-gray-light); }
.rs-list-row:last-child { border-bottom: none; }

.rs-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--rs-accent-soft);
  color: var(--rs-ink);
  display: flex; align-items: center; justify-content: center;
  font-weight: 650; font-size: 13px;
  flex-shrink: 0;
  font-family: var(--font-display);
}

.rs-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Modal */
.rs-modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(20, 23, 31, 0.42);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 5vh 16px;
  z-index: 100;
  overflow-y: auto;
}
.rs-modal {
  background: var(--rs-white);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 560px;
  box-shadow: var(--shadow-lift);
  animation: rs-modal-in 0.18s ease;
}
@keyframes rs-modal-in {
  from { opacity: 0; transform: translateY(8px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.rs-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px;
  border-bottom: 1px solid var(--rs-border-soft);
}
.rs-modal-head h3 { font-size: 16.5px; }
.rs-modal-body { padding: 20px 22px; max-height: 66vh; overflow-y: auto; }
.rs-modal-foot { padding: 16px 22px; border-top: 1px solid var(--rs-border-soft); display: flex; justify-content: flex-end; gap: 10px; }
.rs-modal-close { border: none; background: var(--rs-gray-light); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

.rs-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rs-border-soft); margin-bottom: 18px; }
.rs-tab { padding: 10px 4px; margin-right: 18px; font-size: 13.5px; font-weight: 600; color: var(--rs-ink-faint); border-bottom: 2px solid transparent; cursor: pointer; }
.rs-tab.is-active { color: var(--rs-ink); border-color: var(--rs-accent); }

.rs-toast-wrap { position: fixed; bottom: 22px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.rs-toast {
  background: var(--rs-ink); color: white;
  padding: 11px 16px; border-radius: 12px; font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-lift);
  animation: rs-toast-in 0.2s ease;
}
@keyframes rs-toast-in { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

/* Calendário */
.rs-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.rs-cal-dow { font-size: 11px; font-weight: 650; color: var(--rs-ink-faint); text-align: center; padding-bottom: 4px; }
.rs-cal-day {
  min-height: 84px;
  border-radius: 12px;
  border: 1px solid var(--rs-border-soft);
  padding: 7px;
  font-size: 12px;
  background: var(--rs-white);
  cursor: pointer;
  transition: background 0.12s ease;
}
.rs-cal-day:hover { background: var(--rs-gray-light); }
.rs-cal-day.is-outside { opacity: 0.35; }
.rs-cal-day.is-today { border-color: var(--rs-accent); box-shadow: 0 0 0 1px var(--rs-accent); }
.rs-cal-daynum { font-weight: 650; font-family: var(--font-display); }
.rs-cal-evt { margin-top: 4px; font-size: 10.5px; padding: 2px 6px; border-radius: 6px; background: var(--rs-accent-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Print (Relatórios -> exportação PDF via impressão do navegador) */
@media print {
  #app-shell > .rs-sidebar, .rs-topbar, .rs-no-print { display: none !important; }
  .rs-content { max-width: 100%; padding: 0; }
  body { background: white; }
}

/* ==========================================================================
   Responsivo
   ========================================================================== */

@media (max-width: 980px) {
  .rs-grid-4 { grid-template-columns: repeat(2, 1fr); }
  .rs-grid-3 { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 760px) {
  .rs-menu-toggle { display: flex; }
  .rs-sidebar {
    position: fixed;
    left: 0; top: 0;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    box-shadow: var(--shadow-lift);
  }
  .rs-sidebar.is-open { transform: translateX(0); }
  .rs-content { padding: 18px 16px 48px; }
  .rs-topbar { padding: 0 16px; }
  .rs-grid-4, .rs-grid-3, .rs-grid-2 { grid-template-columns: 1fr 1fr; }
  .rs-field-row { grid-template-columns: 1fr; }
  .rs-cal-day { min-height: 56px; }
}

@supports (padding: max(0px)) {
  .rs-sidebar { padding-left: max(16px, env(safe-area-inset-left)); }
  .rs-content { padding-left: max(28px, env(safe-area-inset-left)); padding-right: max(28px, env(safe-area-inset-right)); }
}

/**
 * RS.storage — Camada de persistência isolada.
 *
 * LocalStorage por baixo, namespaced por conta logada (cada usuário/PIN
 * tem seu próprio espaço, igual ao ela.organiza). Toda escrita que muda
 * dados (create/update/remove) também alimenta a fila de sincronização
 * (RS.sync), quando há uma conta ativa — ver bloco RS.sync mais abaixo.
 *
 * Convenção de chaves: "<namespace><entidade>" guarda um array JSON de
 * registros. Convenção de registro: todo item tem sempre
 * { id, createdAt, updatedAt }.
 */
(function (global) {
  "use strict";

  let PREFIX = "rs:";              // namespace ativo (muda por conta logada)
  const PREFIX_LOCAL = "rs:";      // namespace local "sem conta" (antes do login)
  const QUOTA_LIMIT_BYTES = 5 * 1024 * 1024;

  const ALLOWED_ENTITIES = ["clientes", "atendimentos", "agenda", "financeiro", "documentos"];
  const DANGEROUS_KEYS = ["__proto__", "constructor", "prototype"];

  function hasLocalStorage() {
    try {
      const t = "__rs_test__";
      window.localStorage.setItem(t, "1");
      window.localStorage.removeItem(t);
      return true;
    } catch (e) {
      return false;
    }
  }

  const memoryFallback = {};
  const persistOk = hasLocalStorage();

  function readRaw(key) {
    if (persistOk) return window.localStorage.getItem(key);
    return Object.prototype.hasOwnProperty.call(memoryFallback, key) ? memoryFallback[key] : null;
  }

  function writeRaw(key, value) {
    if (!persistOk) {
      memoryFallback[key] = value;
      return { ok: true };
    }
    try {
      window.localStorage.setItem(key, value);
      return { ok: true };
    } catch (err) {
      const isQuota =
        err &&
        (err.name === "QuotaExceededError" ||
          err.name === "NS_ERROR_DOM_QUOTA_REACHED" ||
          err.code === 22 ||
          err.code === 1014);
      return { ok: false, quota: !!isQuota, error: err };
    }
  }

  function sanitizePatch(obj) {
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) return {};
    const clean = {};
    Object.keys(obj).forEach((k) => {
      if (DANGEROUS_KEYS.indexOf(k) !== -1) return;
      clean[k] = obj[k];
    });
    return clean;
  }

  function assertEntity(entity) {
    if (ALLOWED_ENTITIES.indexOf(entity) === -1) {
      throw new Error('RS.storage: entidade "' + entity + '" não é reconhecida.');
    }
  }

  let fallbackCounter = 0;
  function generateId() {
    if (global.crypto && typeof global.crypto.randomUUID === "function") {
      return global.crypto.randomUUID();
    }
    fallbackCounter += 1;
    let rand;
    if (global.crypto && typeof global.crypto.getRandomValues === "function") {
      const bytes = global.crypto.getRandomValues(new Uint8Array(8));
      rand = Array.prototype.map.call(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
    } else {
      rand = Math.random().toString(16).slice(2) + Math.random().toString(16).slice(2);
    }
    return "id-" + Date.now().toString(36) + "-" + fallbackCounter.toString(36) + "-" + rand;
  }

  function nowISO() {
    return new Date().toISOString();
  }

  function notifyQuotaFull() {
    if (global.RS && typeof global.RS.toast === "function") {
      global.RS.toast("Armazenamento cheio — exporte um backup em Configurações e libere espaço.");
    }
  }

   *  conta recém-logada, só na primeira vez (quando a conta ainda não tem
   *  nada salvo) — mesma lógica do "KEY_MIGRADO" do ela.organiza. Preserva
   *  o que a pessoa já tinha cadastrado localmente antes de criar login. */

    if (novoPrefix === PREFIX_LOCAL) return;
    const marcador = novoPrefix + "migrado";

    ALLOWED_ENTITIES.forEach((entity) => {
      const destino = novoPrefix + entity;
      const origem = PREFIX_LOCAL + entity;
      if (readRaw(destino)) return; // já tem dado na conta, não sobrescreve
      const raw = readRaw(origem);
      if (raw) writeRaw(destino, raw);

    if (global.RS && global.RS.sync && typeof global.RS.sync.enqueue === "function") {
      global.RS.sync.enqueue(entity, record);
    }
  }

    if (global.RS && global.RS.sync && typeof global.RS.sync.enqueueRemocao === "function") {
      global.RS.sync.enqueueRemocao(entity, id);
    }
  }

    isPersistent: persistOk,
    generateId,

    /** Troca o namespace ativo (chamado pelo login/logout). migrate=true
     *  também importa os dados que estavam soltos no modo local. */
    setAccountNamespace(userId, migrate) {
      PREFIX = userId ? "rs:acct:" + userId + ":" : PREFIX_LOCAL;
      if (userId && migrate) migrarSeNecessario(PREFIX);
    },

    list(entity) {
      assertEntity(entity);
      const raw = readRaw(PREFIX + entity);
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);

        console.warn("RS.storage: falha ao ler '" + entity + "', retornando vazio.", e);

        return false;
      }
      return true;
    },

    getById(entity, id) {
      return this.list(entity).find((r) => r.id === id) || null;

    create(entity, data) {

      if (ok) syncEnqueue(entity, record);
      return ok ? record : null;
    },

    update(entity, id, patch) {
      assertEntity(entity);
      const records = this.list(entity);
      const idx = records.findIndex((r) => r.id === id);
      if (idx === -1) return null;
      const merged = Object.assign({}, records[idx], sanitizePatch(patch), {
        id: records[idx].id,
        updatedAt: nowISO(),
      });
      records[idx] = merged;
      const ok = this.saveAll(entity, records);
      if (ok) syncEnqueue(entity, merged);
      return ok ? merged : null;
    },

    remove(entity, id) {
      assertEntity(entity);
      const records = this.list(entity).filter((r) => r.id !== id);
      const ok = this.saveAll(entity, records);
      if (ok) syncEnqueueRemocao(entity, id);
      return ok;
    },

    getValue(key, fallback) {
      const raw = readRaw(PREFIX + "val:" + key);
      if (raw === null || raw === undefined) return fallback;
      try {
        return JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    },

    setValue(key, value) {
      const res = writeRaw(PREFIX + "val:" + key, JSON.stringify(value));
      if (!res.ok && res.quota) notifyQuotaFull();
      return value;
    },

    exportAll(entities) {
      const dump = { app: "ela-atende", version: 1, exportedAt: nowISO(), entities: {} };
      (entities || ALLOWED_ENTITIES).forEach((e) => {
        dump.entities[e] = this.list(e);
      });
      return dump;
    },

    importAll(dump) {
      if (!dump || typeof dump !== "object" || !dump.entities || typeof dump.entities !== "object") {
        return { ok: false, reason: "Arquivo de backup inválido." };
      }
      const keys = Object.keys(dump.entities).filter((k) => ALLOWED_ENTITIES.indexOf(k) !== -1);
      if (!keys.length) return { ok: false, reason: "Nenhuma entidade reconhecida no arquivo." };
      keys.forEach((k) => {
        const list = Array.isArray(dump.entities[k]) ? dump.entities[k] : [];
        this.saveAll(k, list);
        if (global.RS && global.RS.sync) list.forEach((rec) => syncEnqueue(k, rec));
      });
      return { ok: true, entities: keys };
    },

    usage() {
      let bytes = 0;
      if (persistOk) {
        for (let i = 0; i < window.localStorage.length; i++) {
          const k = window.localStorage.key(i);
          if (k && k.indexOf("rs:") === 0) {
            bytes += (k.length + (window.localStorage.getItem(k) || "").length) * 2;
          }
        }
      } else {
        Object.keys(memoryFallback).forEach((k) => {
          bytes += (k.length + (memoryFallback[k] || "").length) * 2;
        });
      }
      return { bytes, limit: QUOTA_LIMIT_BYTES, percent: Math.min(100, (bytes / QUOTA_LIMIT_BYTES) * 100) };
    },
  };

  global.RS = global.RS || {};
  global.RS.storage = Storage;
  if (typeof Object.freeze === "function") Object.freeze(Storage);
})(window);

      if (!ativo() || ENTITIES.indexOf(entity) === -1) return;
      const fila = lerFila().filter((item) => !(item.id === record.id && item.entidade === entity));
      fila.push({ entidade: entity, operacao: "upsert", id: record.id, payload: record, tentativas: 0 });
      gravarFila(fila);
      tentarProcessarFila();
    }

    function enqueueRemocao(entity, id) {
      if (!ativo() || ENTITIES.indexOf(entity) === -1) return;
      const fila = lerFila().filter((item) => !(item.id === id && item.entidade === entity));
      fila.push({ entidade: entity, operacao: "delete", id: id, payload: null, tentativas: 0 });
      gravarFila(fila);
      tentarProcessarFila();
    }

    function tentarProcessarFila() {
      if (!ativo() || aProcessar) return;
      if (typeof navigator !== "undefined" && navigator.onLine === false) return;
      const fila = lerFila();
      if (!fila.length) return;
      aProcessar = true;
      loadSupabase(
        (client) => processarSequencial(client, 0, () => { aProcessar = false; }),
        () => { aProcessar = false; }
      );
    }

    function processarSequencial(client, index, aoTerminar) {
      const fila = lerFila();
      if (index >= fila.length) { aoTerminar(); return; }
      const item = fila[index];
      let pedido;
      try {
        if (item.operacao === "delete") {
          pedido = client.from(item.entidade).delete().eq("id", item.id).eq("user_id", userId);
        } else {
          const linha = Object.assign({ user_id: userId }, mapToRemote(item.entidade, item.payload));
          pedido = client.from(item.entidade).upsert(linha);
        }
      } catch (e) {
        processarSequencial(client, index + 1, aoTerminar);
        return;
      }
      pedido
        .then((res) => {
          if (res && res.error) {
            console.warn("[sync] falha ao gravar:", item.entidade, item.operacao, res.error);
            processarSequencial(client, index + 1, aoTerminar);
            return;
          }
          const restante = lerFila().filter((f) => !(f.id === item.id && f.entidade === item.entidade && f.operacao === item.operacao));
          gravarFila(restante);
          processarSequencial(client, 0, aoTerminar);
        })
        .catch(() => processarSequencial(client, index + 1, aoTerminar));
    }

    function puxarDoServidor(callback) {
      if (!ativo()) { callback(null); return; }
      loadSupabase(
        (client) => {
          Promise.all(ENTITIES.map((e) => client.from(e).select("*").eq("user_id", userId)))
            .then((resultados) => {
              const porEntidade = {};
              resultados.forEach((res, i) => {
                if (res.error) console.warn("[sync] falha ao ler", ENTITIES[i], res.error);
                porEntidade[ENTITIES[i]] = res.data || [];
              });
              callback(porEntidade);
            })
            .catch(() => callback(null));
        },
        () => callback(null)
      );
    }

    function estaSincronizado() {
      if (!ativo()) return false;
      if (typeof navigator !== "undefined" && navigator.onLine === false) return false;
      return lerFila().length === 0;
    }

    function idsPendentes(entity) {
      return new Set(lerFila().filter((item) => item.entidade === entity).map((item) => item.id));
    }

    /** Funde os registros locais desta entidade com os que vieram do servidor.
     *  Regra: quem tiver updatedAt mais recente ganha; exclusões feitas em
     *  outro aparelho só se propagam para registros já confirmados no
     *  servidor (nunca apaga algo criado localmente e ainda não enviado). */
    function fundir(entity, remotos) {
      const chaveConhecidos = "rs:sync:conhecidos:" + entity + ":" + userId;
      let conhecidos;
      try { conhecidos = new Set(JSON.parse(window.localStorage.getItem(chaveConhecidos) || "[]")); }
      catch (e) { conhecidos = new Set(); }
      const pendentes = idsPendentes(entity);

      const locais = RS.storage.list(entity);
      const porId = {};
      locais.forEach((r) => { porId[r.id] = r; });

      const idsRemotos = new Set();
      remotos.forEach((linha) => {
        const remoto = mapFromRemote(entity, linha);
        idsRemotos.add(remoto.id);
        conhecidos.add(remoto.id);
        const local = porId[remoto.id];
        if (!local) { porId[remoto.id] = remoto; return; }
        const localTs = new Date(local.updatedAt || local.createdAt || 0).getTime();
        const remotoTs = new Date(remoto.updatedAt).getTime();
        if (remotoTs > localTs) porId[remoto.id] = remoto;
      });

      Object.keys(porId).forEach((id) => {
        if (idsRemotos.has(id)) return;
        if (pendentes.has(id)) return;
        if (conhecidos.has(id)) delete porId[id];
      });

      RS.storage.saveAll(entity, Object.values(porId));
      try { window.localStorage.setItem(chaveConhecidos, JSON.stringify(Array.from(conhecidos))); } catch (e) {}
    }

    function sincronizarTudo(callback) {
      puxarDoServidor((porEntidade) => {
        if (porEntidade) {
          ENTITIES.forEach((entity) => fundir(entity, porEntidade[entity] || []));
        }
        if (callback) callback();
      });
    }

    return { iniciar, parar, enqueue, enqueueRemocao, tentarProcessarFila, sincronizarTudo, estaSincronizado, ativo, supabaseConfigurado: () => !!(SUPABASE_URL && SUPABASE_PUBLISHABLE_KEY) };
  })();

  if (typeof window.addEventListener === "function") {
    window.addEventListener("online", () => SyncManager.tentarProcessarFila());
  }

  RS.sync = SyncManager;
  RS.syncLoadSupabase = loadSupabase;
})(window);

/**
 * RS.gate — Tela de login (e-mail + usuario + PIN), com suporte a
 * i18n (PT-PT / PT-BR). So aparece quando o Supabase esta configurado.
 */
(function (global) {
  "use strict";
  const RS = global.RS;

  const ACTIVE_ACCOUNT_KEY = "rs:activeAccount";

  function salvarContaAtiva(userId, label, email) {
    try {
      window.localStorage.setItem(ACTIVE_ACCOUNT_KEY, JSON.stringify({ userId, label, email }));
    } catch (e) {}
  }
  function limparContaAtiva() {
    try { window.localStorage.removeItem(ACTIVE_ACCOUNT_KEY); } catch (e) {}
  }
  function contaAtivaSalva() {
    try { return JSON.parse(window.localStorage.getItem(ACTIVE_ACCOUNT_KEY) || "null"); } catch (e) { return null; }
  }

  function iniciarApp(userId, label, email) {
    salvarContaAtiva(userId, label, email);
    RS.storage.setAccountNamespace(userId, true);
    RS.sync.iniciar(userId);
    const overlay = document.getElementById("rs-gate-overlay");
    if (overlay) overlay.remove();
    RS.startApp();
    RS.sync.sincronizarTudo(() => { if (RS.router) RS.router.resolve(); });

        <div class="rs-gate-brand">ela.<span class="rs-wordmark-italic">atende</span></div>

            </div>
          </div>
          <div class="rs-field"><input type="password" class="rs-input" id="gate-pin" placeholder="${t("gate.pin.placeholder")}" data-i18n-placeholder="gate.pin.placeholder" inputmode="numeric" pattern="[0-9]*" maxlength="4" required autocomplete="off"></div>
          <p id="rs-gate-error" class="rs-gate-error" style="display:none;"></p>

        </form>
        <form id="rs-gate-pin-troca" style="display:none;">
          <p class="rs-gate-sub" data-i18n="gate.pinTroca.subtitulo">${t("gate.pinTroca.subtitulo")}</p>
          <div class="rs-field"><input type="password" class="rs-input" id="gate-pin-novo" placeholder="${t("gate.pinTroca.novoPin.placeholder")}" data-i18n-placeholder="gate.pinTroca.novoPin.placeholder" inputmode="numeric" maxlength="4"></div>
          <div class="rs-field"><input type="password" class="rs-input" id="gate-pin-confirma" placeholder="${t("gate.pinTroca.confirmarPin.placeholder")}" data-i18n-placeholder="gate.pinTroca.confirmarPin.placeholder" inputmode="numeric" maxlength="4"></div>
          <p id="rs-gate-troca-error" class="rs-gate-error" style="display:none;"></p>
          <button type="submit" class="rs-btn rs-btn-primary" style="width:100%; justify-content:center;" data-i18n="gate.pinTroca.submeter">${t("gate.pinTroca.submeter")}</button>

    document.body.appendChild(wrap);
    RS.I18n.aplicar();

  }

  function wire(wrap) {
    const t = RS.I18n.t;
    const form = wrap.querySelector("#rs-gate-form");
    const errorEl = wrap.querySelector("#rs-gate-error");
    const statusEl = wrap.querySelector("#rs-gate-status");
    const submitBtn = wrap.querySelector("#rs-gate-submit");
    const trocaForm = wrap.querySelector("#rs-gate-pin-troca");

    function mostrarErro(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = "block";
      statusEl.style.display = "none";
      submitBtn.disabled = false;
      submitBtn.textContent = t("gate.entrar");
    }
    function mostrarStatus(msg) {
      statusEl.textContent = msg;
      statusEl.style.display = "block";
      errorEl.style.display = "none";
    }

    wrap.querySelector("#rs-gate-forgot").addEventListener("click", () => {
      alert(t("gate.esqueciPin.mensagem"));
    });

    form.addEventListener("submit", (ev) => {
      ev.preventDefault();
      const email = (wrap.querySelector("#gate-email").value || "").trim().toLowerCase();
      const sufixo = (wrap.querySelector("#gate-user").value || "").trim();
      const usuario = sufixo ? "ela." + sufixo : "";
      const pin = (wrap.querySelector("#gate-pin").value || "").trim();

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { mostrarErro(t("gate.erro.emailInvalido")); return; }
      if (!usuario) { mostrarErro(t("gate.erro.utilizadorObrigatorio")); return; }
      if (!/^\d{4}$/.test(pin)) { mostrarErro(t("gate.erro.pinInvalido")); return; }

      const senha = "ela-pin-" + pin;
      submitBtn.disabled = true;
      submitBtn.textContent = t("gate.aentrar");
      mostrarStatus(t("gate.status.verificando"));

      RS.syncLoadSupabase((client) => {
        client.rpc("username_existe", { p_label: usuario }).then((resp) => {
          if (resp.error) { mostrarErro(t("gate.erro.falhaServidor") + " (" + resp.error.message + ")."); return; }
          if (!resp.data) {
            client.auth.signUp({ email, password: senha }).then((res) => {
              function gravarPerfil(uidReal) {
                client.from("profiles").upsert({ id: uidReal, label: usuario }).then((ins) => {
                  if (ins.error) { mostrarErro(t("gate.erro.falhaGuardarPerfil") + " (" + ins.error.message + ")."); return; }
                  iniciarApp(uidReal, usuario, email);
                }).catch((e) => mostrarErro(t("gate.erro.redeGenerico") + " " + e.message));
              }
              function tentarEntrarDireto() {
                mostrarStatus(t("gate.status.concluindoAutenticacao"));
                client.auth.signInWithPassword({ email, password: senha }).then((loginRes) => {
                  if (loginRes.error || !loginRes.data || !loginRes.data.session || !loginRes.data.user) {
                    mostrarErro(t("gate.erro.contaPendente"));
                    return;
                  }
                  gravarPerfil(loginRes.data.user.id);
                }).catch((e) => mostrarErro(t("gate.erro.redeGenerico") + " " + e.message));
              }
              if (res.data && res.data.session && res.data.user) { gravarPerfil(res.data.user.id); return; }
              tentarEntrarDireto();
            }).catch((e) => mostrarErro(t("gate.erro.redeGenerico") + " " + e.message));
          } else {
            client.auth.signInWithPassword({ email, password: senha }).then((res) => {
              if (res.error || !res.data || !res.data.user) { mostrarErro(t("gate.erro.credenciaisInvalidas")); return; }
              const uid = res.data.user.id;
              client.from("profiles").select("label, pin_temporario").eq("id", uid).single().then((prof) => {
                const label = (prof.data && prof.data.label) || usuario;
                if (prof.data && prof.data.pin_temporario) {
                  submitBtn.disabled = false; submitBtn.textContent = t("gate.entrar");
                  pedirTrocaPin(wrap, client, uid, label, email, trocaForm);
                  return;
                }
                iniciarApp(uid, label, email);
              }).catch((e) => mostrarErro(t("gate.erro.redeGenerico") + " " + e.message));
            }).catch((e) => mostrarErro(t("gate.erro.redeGenerico") + " " + e.message));
          }
        }).catch((e) => mostrarErro(t("gate.erro.redeGenerico") + " " + e.message));
      }, () => mostrarErro(t("gate.erro.semInternet")));
    });
  }

  function pedirTrocaPin(wrap, client, uid, label, email, trocaForm) {
    const t = RS.I18n.t;
    wrap.querySelector("#rs-gate-form").style.display = "none";
    trocaForm.style.display = "block";
    trocaForm.onsubmit = (ev) => {
      ev.preventDefault();
      const novo = (wrap.querySelector("#gate-pin-novo").value || "").trim();
      const confirma = (wrap.querySelector("#gate-pin-confirma").value || "").trim();
      const errEl = wrap.querySelector("#rs-gate-troca-error");
      function err(msg) { errEl.textContent = msg; errEl.style.display = "block"; }
      if (!/^\d{4}$/.test(novo)) { err(t("gate.pinTroca.erro.pinInvalido")); return; }
      if (novo !== confirma) { err(t("gate.pinTroca.erro.naoCoincidem")); return; }
      errEl.style.display = "none";
      client.auth.updateUser({ password: "ela-pin-" + novo }).then((upd) => {
        if (upd.error) { err(t("gate.pinTroca.erro.falhaDefinir") + " (" + upd.error.message + ")."); return; }
        client.from("profiles").update({ pin_temporario: false }).eq("id", uid).then((prof) => {
          if (prof.error) { err(t("gate.pinTroca.erro.falhaConcluir") + " (" + prof.error.message + ")."); return; }
          iniciarApp(uid, label, email);
        }).catch((e) => err(t("gate.erro.redeGenerico") + " " + e.message));
      }).catch((e) => err(t("gate.erro.redeGenerico") + " " + e.message));
    };
  }

  RS.gate = { render, limparContaAtiva, contaAtivaSalva };
})(window);

/**
 * RS.config — Camada de personalização (white-label).
 *
 * Este é o único arquivo que, em teoria, muda de um cliente para outro.
 * Termos, rótulos de campos e cores vêm todos daqui. Os módulos nunca têm
 * strings de domínio "hardcoded" — sempre leem de RS.config.labels.
 *
 * Para originar "Gestão para Fonoaudiólogo", "Gestão para Professor
 * Particular" etc., basta duplicar/alterar este objeto (ou, em runtime,
 * editar via módulo Configurações) — nunca reconstruir o sistema.
 */
(function (global) {
  "use strict";

  const DEFAULTS = {
    marca: {
      nome: "ela.atende",
      slogan: "Seu atendimento, organizado.",
      logoIniciais: "e.",
    },

    profissional: {
      nome: "",
      especialidade: "Atendimento Especializado",
      corPrincipal: "blue", // blue | pink | yellow | lilac
    },

    // Terminologia genérica e neutra — fácil de trocar por profissão.
    labels: {
      cliente_singular: "Cliente",
      cliente_plural: "Clientes",
      atendimento_singular: "Atendimento",
      atendimento_plural: "Atendimentos",
      profissional_singular: "Profissional",
      responsavel: "Responsável",
      diagnostico: "Observação clínica",
      objetivos: "Objetivos do acompanhamento",
    },

    // Tipos de atendimento padrão (editável em Configurações).
    tiposAtendimento: ["Sessão individual", "Avaliação", "Devolutiva", "Reunião"],

    // Categorias financeiras padrão.
    categoriasFinanceiras: ["Sessão avulsa", "Pacote", "Mensalidade", "Material", "Outro"],
  };

  const STORAGE_KEY = "config";

  function load() {
    const saved = global.RS.storage.getValue(STORAGE_KEY, null);
    if (!saved) return JSON.parse(JSON.stringify(DEFAULTS));
    // merge raso por seção para tolerar versões antigas salvas
    return {
      marca: Object.assign({}, DEFAULTS.marca, saved.marca),
      profissional: Object.assign({}, DEFAULTS.profissional, saved.profissional),
      labels: Object.assign({}, DEFAULTS.labels, saved.labels),
      tiposAtendimento: saved.tiposAtendimento || DEFAULTS.tiposAtendimento,
      categoriasFinanceiras: saved.categoriasFinanceiras || DEFAULTS.categoriasFinanceiras,
    };
  }

  function save(config) {
    global.RS.storage.setValue(STORAGE_KEY, config);
    applyTheme(config);
    return config;
  }

  function applyTheme(config) {
    const cor = (config.profissional && config.profissional.corPrincipal) || "blue";
    document.documentElement.setAttribute("data-accent", cor);
  }

  global.RS = global.RS || {};
  global.RS.config = load();
  global.RS.config.save = function (patch) {
    const merged = {
      marca: Object.assign({}, global.RS.config.marca, patch.marca),
      profissional: Object.assign({}, global.RS.config.profissional, patch.profissional),
      labels: Object.assign({}, global.RS.config.labels, patch.labels),
      tiposAtendimento: patch.tiposAtendimento || global.RS.config.tiposAtendimento,
      categoriasFinanceiras: patch.categoriasFinanceiras || global.RS.config.categoriasFinanceiras,
    };
    Object.assign(global.RS.config, merged, { save: global.RS.config.save });
    save(merged);
    return global.RS.config;
  };

  applyTheme(global.RS.config);
})(window);

/**
 * RS.app — Shell, roteador de hash e utilitários compartilhados entre módulos.
 * Módulos são independentes: cada um só precisa se registrar em RS.modules.
 */
(function (global) {
  "use strict";

  const RS = global.RS;

  // ------------------------------------------------------------------
  // Ordem/menu — única lista que define a navegação da plataforma-base.
  // ------------------------------------------------------------------
  const MENU = [
    { id: "dashboard", icon: "grid" },
    { id: "clientes", icon: "users" },
    { id: "agenda", icon: "calendar" },
    { id: "financeiro", icon: "wallet" },
    { id: "relatorios", icon: "chart" },
    { id: "configuracoes", icon: "settings" },
  ];

  // ------------------------------------------------------------------
  // Utilitários
  // ------------------------------------------------------------------
  const util = {
    formatDate(iso, opts) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (isNaN(d)) return "—";
      return d.toLocaleDateString("pt-BR", opts || { day: "2-digit", month: "2-digit", year: "numeric" });
    },
    formatDateTime(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (isNaN(d)) return "—";
      return d.toLocaleDateString("pt-BR") + " · " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    },
    formatCurrency(v) {
      const n = Number(v) || 0;
      return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    },
    /** Formata um objeto Date como "YYYY-MM-DD" usando o horário LOCAL.
     *  Nunca usar toISOString() para isso: ele converte para UTC e pode
     *  mudar o dia do calendário dependendo do fuso horário do usuário. */
    toLocalDateStr(d) {
      d = d || new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    },
    initials(name) {
      if (!name) return "?";
      const parts = name.trim().split(/\s+/);
      return ((parts[0] || "")[0] || "").toUpperCase() + ((parts[1] || "")[0] || "").toUpperCase();
    },
    escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    },
    el(html) {
      const t = document.createElement("template");
      t.innerHTML = html.trim();
      return t.content.firstElementChild;
    },
    debounce(fn, ms) {
      let t;
      return function (...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), ms || 200);
      };
    },
  };

  // ------------------------------------------------------------------
  // Toast
  // ------------------------------------------------------------------
  function toast(msg) {
    let wrap = document.getElementById("rs-toast-wrap");
    if (!wrap) {
      wrap = util.el('<div id="rs-toast-wrap" class="rs-toast-wrap"></div>');
      document.body.appendChild(wrap);
    }
    const t = util.el('<div class="rs-toast"></div>');
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => {
      t.style.transition = "opacity .2s ease";
      t.style.opacity = "0";
      setTimeout(() => t.remove(), 200);
    }, 2400);
  }

  // ------------------------------------------------------------------
  // Modal genérico — módulos passam apenas o HTML do formulário.
  // ------------------------------------------------------------------
  function closeModal() {
    const bd = document.getElementById("rs-modal-backdrop");
    if (bd) bd.remove();
  }

  function openModal({ title, bodyHtml, footHtml, onMount, wide }) {
    closeModal();
    const bd = util.el(`
      <div class="rs-modal-backdrop" id="rs-modal-backdrop">
        <div class="rs-modal" style="${wide ? "max-width:720px" : ""}">
          <div class="rs-modal-head">
            <h3>${util.escapeHtml(title || "")}</h3>
            <button class="rs-modal-close" data-close>${RS.icon("close", 15)}</button>
          </div>
          <div class="rs-modal-body">${bodyHtml || ""}</div>
          ${footHtml ? `<div class="rs-modal-foot">${footHtml}</div>` : ""}
        </div>
      </div>
    `);
    bd.addEventListener("click", (e) => {
      if (e.target === bd || e.target.closest("[data-close]")) closeModal();
    });
    document.body.appendChild(bd);
    if (onMount) onMount(bd);
    return bd;
  }

  // ------------------------------------------------------------------
  // Router baseado em hash — cada módulo expõe render(container)
  // ------------------------------------------------------------------
  const router = {
    current: null,
    start() {
      window.addEventListener("hashchange", () => router.resolve());
      router.resolve();
    },
    resolve() {
      const hash = (location.hash || "#/dashboard").replace(/^#\//, "");
      const [routeId, ...rest] = hash.split("/");
      const id = RS.modules[routeId] ? routeId : "dashboard";
      router.render(id, rest.join("/"));
    },
    navigate(id, param) {
      location.hash = "#/" + id + (param ? "/" + param : "");
    },
    render(id, param) {
      const mod = RS.modules[id];
      if (!mod) return;
      router.current = id;
      renderNavState(id);
      renderTopbar(mod);
      const content = document.getElementById("rs-content");
      content.innerHTML = "";
      content.scrollTop = 0;
      try {
        mod.render(content, param);
      } catch (e) {
        console.error("[render] falha ao desenhar a tela '" + id + "':", e);
        content.innerHTML = `
          <div class="rs-card" style="max-width:520px; margin:40px auto; text-align:center;">
            <div class="rs-section-title">Algo deu errado nesta tela</div>
            <p style="font-size:13px; color:var(--rs-ink-soft); margin-bottom:16px;">
              Não foi possível carregar "${mod.label || id}". Os seus dados continuam salvos — isto é só um problema ao exibir esta tela.
            </p>
            <button class="rs-btn rs-btn-primary" id="rs-error-home">${RS.icon("grid", 14)} Voltar ao painel</button>
          </div>`;
        const btn = document.getElementById("rs-error-home");
        if (btn) btn.addEventListener("click", () => router.navigate("dashboard"));
      }
      closeMobileNav();
    },
  };

  function renderTopbar(mod) {
    const titleEl = document.getElementById("rs-topbar-title");
    const subEl = document.getElementById("rs-topbar-sub");
    titleEl.textContent = mod.label;
    subEl.textContent = mod.subtitle || "";
    if (mod.i18nKey) { titleEl.setAttribute("data-i18n", mod.i18nKey); } else { titleEl.removeAttribute("data-i18n"); }
    if (mod.i18nSubtitleKey) { subEl.setAttribute("data-i18n", mod.i18nSubtitleKey); } else { subEl.removeAttribute("data-i18n"); }
  }

  function renderNavState(activeId) {
    document.querySelectorAll(".rs-nav-item").forEach((btn) => {
      btn.classList.toggle("is-active", btn.dataset.route === activeId);
    });
  }

  function closeMobileNav() {
    document.querySelector(".rs-sidebar").classList.remove("is-open");
  }

  function registerServiceWorker() {
    /* Versão single-file: sem Service Worker separado. O app funciona
       100% offline mesmo assim, pois usa apenas LocalStorage. */
  }

  RS.util = util;
  RS.toast = toast;
  RS.openModal = openModal;
  RS.closeModal = closeModal;
  RS.router = router;

  // ------------------------------------------------------------------
  // Indicador de sincronização (bolinha verde/vermelha no topo)
  // ------------------------------------------------------------------
  function renderSyncIndicator() {
    if (!RS.sync.supabaseConfigurado()) return;
    const holder = document.querySelector(".rs-topbar > div:last-child") || document.querySelector(".rs-topbar");
    if (!holder || document.getElementById("rs-sync-dot")) return;
    const dot = util.el('<span id="rs-sync-dot" class="rs-sync-dot" title="Sincronizando..."></span>');
    holder.appendChild(dot);
    updateSyncIndicator();
    setInterval(updateSyncIndicator, 4000);
  }
  function updateSyncIndicator() {
    const dot = document.getElementById("rs-sync-dot");
    if (!dot) return;
    const ok = RS.sync.estaSincronizado();
    dot.classList.toggle("is-online", ok);
    dot.classList.toggle("is-offline", !ok);
    dot.title = ok ? "Sincronizado com a nuvem" : "Sincronizando / offline — os dados ficam salvos neste aparelho";
  }

  // ------------------------------------------------------------------
  // Início do app (depois do login, ou direto se não há Supabase configurado)
  // ------------------------------------------------------------------
  function startApp() {
    buildShell();
    router.start();
    registerServiceWorker();
    renderSyncIndicator();
  }
  RS.startApp = startApp;

  const ACTIVE_ACCOUNT_KEY = "rs:activeAccount";

  document.addEventListener("DOMContentLoaded", () => {
    if (!RS.sync.supabaseConfigurado()) {
      // Sem credenciais do Supabase ainda: app funciona 100% local, como sempre.
      startApp();
      return;
    }
    let saved = null;
    try { saved = JSON.parse(window.localStorage.getItem(ACTIVE_ACCOUNT_KEY) || "null"); } catch (e) {}
    if (saved && saved.userId) {
      RS.storage.setAccountNamespace(saved.userId, true);
      RS.sync.iniciar(saved.userId);
      startApp();
      RS.sync.sincronizarTudo(() => { router.resolve(); });
      return;
    }
    RS.gate.render();
  });
})(window);


/* ---- js/modules/dashboard.js ---- */
(function (global) {
  "use strict";
  const RS = global.RS;
  const { storage, util } = RS;

  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  function computeStats() {
    const clientes = storage.list("clientes");
    const atendimentos = storage.list("atendimentos");
    const agenda = storage.list("agenda");
    const financeiro = storage.list("financeiro");

    const now = new Date();
    const in7 = new Date(now.getTime() + 7 * 86400000);
    const days30ago = new Date(now.getTime() - 30 * 86400000);

    const hojeAgenda = agenda.filter((e) => e.data && isSameDay(new Date(e.data), now) && e.status !== "cancelado");
    const proximos = agenda
      .filter((e) => e.data && new Date(e.data) > now && new Date(e.data) <= in7 && e.status !== "cancelado")
      .sort((a, b) => new Date(a.data) - new Date(b.data));

    const clientesAtivos = clientes.filter((c) => c.status !== "inativo");
    const novos = clientes.filter((c) => c.createdAt && new Date(c.createdAt) >= days30ago);

    const pendencias = financeiro.filter((f) => f.status === "pendente");
    const recebidoMes = financeiro
      .filter((f) => f.tipo === "receita" && f.status === "pago" && f.data && new Date(f.data).getMonth() === now.getMonth() && new Date(f.data).getFullYear() === now.getFullYear())
      .reduce((s, f) => s + Number(f.valor || 0), 0);
    const aReceber = pendencias.filter((f) => f.tipo === "receita").reduce((s, f) => s + Number(f.valor || 0), 0);

    return { clientes, atendimentos, agenda, hojeAgenda, proximos, clientesAtivos, novos, pendencias, recebidoMes, aReceber };
  }

  function weeklyEvolution(atendimentos) {
    const days = [];
    const now = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now.getTime() - i * 86400000);
      const count = atendimentos.filter((a) => a.data && isSameDay(new Date(a.data), d)).length;
      days.push({ label: d.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", ""), count });
    }
    return days;
  }

  function render(container) {
    const t = RS.I18n.t;
    const s = computeStats();
    const cfg = RS.config;
    const nomeCliente = cfg.labels.cliente_plural;
    const week = weeklyEvolution(s.atendimentos);
    const maxWeek = Math.max(1, ...week.map((w) => w.count));

    const monthLabel = new Date().toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    const monthCap = monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1);
    const idSlug = (cfg.profissional.nome || "atende").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");

    container.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:18px;">
        <div style="font-size:13px; color:var(--rs-ink-faint);">${monthCap}</div>
        <span class="rs-badge rs-badge-gray" style="font-weight:700;">ela.${idSlug}</span>
      </div>
      <div class="rs-grid rs-grid-4" style="margin-bottom:18px;">
        ${statCard("clock", "blue", t("dashboard.atendimentosHoje"), s.hojeAgenda.length, s.hojeAgenda.length ? t("dashboard.agendadosParaHoje") : t("dashboard.nenhumAgendamentoHoje"))}
        ${statCard("calendar", "lilac", t("dashboard.proximos7dias"), s.proximos.length, t("dashboard.atendimentosAgendados"))}
        ${statCard("users", "pink", nomeCliente + " " + t("dashboard.ativos"), s.clientesAtivos.length, s.novos.length + " " + t("dashboard.novosUltimos30dias"))}
        ${statCard("wallet", "yellow", t("dashboard.aReceber"), util.formatCurrency(s.aReceber), s.pendencias.length + " " + t("dashboard.pendencias"))}
      </div>

      <div class="rs-grid rs-grid-2" style="align-items:start; margin-bottom:18px;">
        <div class="rs-card">
          <div class="rs-section-title">${t("dashboard.agendaHoje")}
            <button class="rs-btn rs-btn-subtle" data-go="agenda">${t("dashboard.verAgenda")} ${RS.icon("arrowRight", 14)}</button>
          </div>
          ${listAgendaHoje(s.hojeAgenda)}
        </div>
        <div class="rs-card">
          <div class="rs-section-title">${t("dashboard.pendenciasFinanceiras")}
            <button class="rs-btn rs-btn-subtle" data-go="financeiro">${t("dashboard.verFinanceiro")} ${RS.icon("arrowRight", 14)}</button>
          </div>
          ${listPendencias(s.pendencias)}
        </div>
      </div>

      <div class="rs-card">
        <div class="rs-section-title">${t("dashboard.evolucaoSemanal")}</div>
        <div style="display:flex; align-items:flex-end; gap:10px; height:120px; padding-top:10px;">
          ${week
            .map(
              (w) => `
            <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;">
              <div style="width:100%; max-width:34px; height:${Math.max(6, (w.count / maxWeek) * 88)}px; border-radius:8px 8px 4px 4px; background:linear-gradient(180deg, var(--rs-blue), var(--rs-lilac));"></div>
              <span style="font-size:11px; color:var(--rs-ink-faint); text-transform:capitalize;">${w.label}</span>
            </div>`
            )
            .join("")}
        </div>
      </div>
    `;

    container.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => RS.router.navigate(b.dataset.go)));
  }

  function statCard(icon, color, label, value, foot) {
    const map = { blue: "var(--rs-blue)", pink: "var(--rs-pink)", yellow: "var(--rs-yellow)", lilac: "var(--rs-lilac)" };
    return `
      <div class="rs-stat" style="--stat-color:${map[color]}">
        <div class="rs-stat-label"><span class="rs-stat-dot"></span>${label}</div>
        <div class="rs-stat-value">${value}</div>
        <div class="rs-stat-foot">${foot}</div>
      </div>`;
  }

  function listAgendaHoje(items) {
    const t = RS.I18n.t;
    if (!items.length) return emptyState("calendar", t("dashboard.nenhumAtendimentoHoje"));
    return items
      .sort((a, b) => new Date(a.data) - new Date(b.data))
      .map(
        (e) => `
      <div class="rs-list-row">
        <div class="rs-avatar">${RS.icon("clock", 16)}</div>
        <div style="flex:1;">
          <div style="font-weight:600; font-size:13.5px;">${RS.util.escapeHtml(e.titulo)}</div>
          <div style="font-size:12px; color:var(--rs-ink-faint);">${new Date(e.data).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</div>
        </div>
        <span class="rs-badge rs-badge-blue">${RS.I18n.t("agenda.status." + (e.status || "confirmado"))}</span>
      </div>`
      )
      .join("");
  }

  function listPendencias(items) {
    const t = RS.I18n.t;
    if (!items.length) return emptyState("wallet", t("dashboard.nenhumaPendencia"));
    return items
      .slice(0, 6)
      .map(
        (f) => `
      <div class="rs-list-row">
        <div class="rs-avatar">${RS.icon("wallet", 16)}</div>
        <div style="flex:1;">
          <div style="font-weight:600; font-size:13.5px;">${RS.util.escapeHtml(f.descricao || f.categoria || t("dashboard.lancamento"))}</div>
          <div style="font-size:12px; color:var(--rs-ink-faint);">${RS.util.formatDate(f.data)}</div>
        </div>
        <span class="rs-mono" style="font-weight:650; font-size:13px;">${RS.util.formatCurrency(f.valor)}</span>
      </div>`
      )
      .join("");
  }

  function emptyState(icon, msg) {
    return `<div class="rs-empty">${RS.icon(icon, 34)}<p>${msg}</p></div>`;
  }

  RS.modules = RS.modules || {};
  RS.modules.dashboard = { id: "dashboard", i18nKey: "nav.dashboard", i18nSubtitleKey: "shell.dashboard.subtitulo", get label() { return RS.I18n.t("nav.dashboard"); }, get subtitle() { return RS.I18n.t("shell.dashboard.subtitulo"); }, render };
})(window);

/* ---- js/modules/clientes.js ---- */
(function (global) {
  "use strict";
  const RS = global.RS;
  const { storage, util } = RS;
  const ENTITY = "clientes";

  let searchTerm = "";
  let statusFilter = "todos";

  function age(dob) {
    if (!dob) return null;
    const d = new Date(dob);
    if (isNaN(d)) return null;
    const diff = Date.now() - d.getTime();
    return Math.floor(diff / (365.25 * 86400000));
  }

  // ---------------------------------------------------------------- LISTA
  function render(container, param) {
    if (param) {
      renderDetail(container, param);
      return;
    }
    renderList(container);
  }

  function renderList(container) {
    const cfg = RS.config;
    const t = RS.I18n.t;
    container.innerHTML = `
      <div style="display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;">
        <div style="position:relative; flex:1; min-width:220px;">
          <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--rs-ink-faint);">${RS.icon("search", 15)}</span>
          <input class="rs-input" id="rs-cli-search" style="padding-left:34px;" placeholder="${t("clientes.buscar")} ${cfg.labels.cliente_plural.toLowerCase()}..." value="${util.escapeHtml(searchTerm)}">
        </div>
        <select class="rs-select" id="rs-cli-filter" style="max-width:160px;">
          <option value="todos" ${statusFilter === "todos" ? "selected" : ""}>${t("comum.todos")}</option>
          <option value="ativo" ${statusFilter === "ativo" ? "selected" : ""}>${t("comum.ativo")}</option>
          <option value="inativo" ${statusFilter === "inativo" ? "selected" : ""}>${t("comum.inativo")}</option>
        </select>
        <button class="rs-btn rs-btn-primary" id="rs-cli-new">${RS.icon("plus", 15)} ${t("clientes.novo")} ${cfg.labels.cliente_singular.toLowerCase()}</button>
      </div>
      <div class="rs-card" id="rs-cli-list"></div>
    `;

    container.querySelector("#rs-cli-search").addEventListener("input", util.debounce((e) => {
      searchTerm = e.target.value;
      renderRows();
    }, 150));
    container.querySelector("#rs-cli-filter").addEventListener("change", (e) => {
      statusFilter = e.target.value;
      renderRows();
    });
    container.querySelector("#rs-cli-new").addEventListener("click", () => openForm());

    renderRows();

    function renderRows() {
      const listEl = container.querySelector("#rs-cli-list");
      let items = storage.list(ENTITY).sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
      if (statusFilter !== "todos") items = items.filter((c) => (c.status || "ativo") === statusFilter);
      if (searchTerm.trim()) {
        const q = searchTerm.trim().toLowerCase();
        items = items.filter((c) => (c.nome || "").toLowerCase().includes(q) || (c.responsavel || "").toLowerCase().includes(q));
      }
      if (!items.length) {
        listEl.innerHTML = `<div class="rs-empty">${RS.icon("users", 36)}<p>${t("clientes.nenhumEncontrado", { singular: cfg.labels.cliente_singular.toLowerCase() })}</p>
          <button class="rs-btn rs-btn-primary" id="rs-cli-empty-new">${RS.icon("plus", 14)} ${t("clientes.cadastrar")} ${cfg.labels.cliente_singular.toLowerCase()}</button></div>`;
        listEl.querySelector("#rs-cli-empty-new").addEventListener("click", () => openForm());
        return;
      }
      listEl.innerHTML = items.map(rowHtml).join("");
      listEl.querySelectorAll("[data-open]").forEach((row) => {
        row.addEventListener("click", () => RS.router.navigate("clientes", row.dataset.open));
      });
    }
  }

  function rowHtml(c) {
    const t = RS.I18n.t;
    const a = age(c.dataNascimento);
    return `
      <div class="rs-list-row" data-open="${c.id}">
        <div class="rs-avatar">${util.initials(c.nome)}</div>
        <div style="flex:1; min-width:0;">
          <div style="font-weight:600; font-size:13.5px;">${util.escapeHtml(c.nome || t("comum.semNome"))}</div>
          <div style="font-size:12px; color:var(--rs-ink-faint);">${a != null ? a + " " + t("comum.anos") + " · " : ""}${util.escapeHtml(c.profissao || c.escola || "")}</div>
        </div>
        <span class="rs-badge ${c.status === "inativo" ? "rs-badge-gray" : "rs-badge-blue"}">${c.status === "inativo" ? t("comum.inativo") : t("comum.ativo")}</span>
        ${RS.icon("chevronRight", 16)}
      </div>`;
  }

  // ---------------------------------------------------------------- FORM
  function openForm(existing) {
    const cfg = RS.config;
    const t = RS.I18n.t;
    const c = existing || {};
    const bodyHtml = `
      <div class="rs-field"><label>${t("clientes.nomeCompleto")}</label><input class="rs-input" id="f-nome" value="${util.escapeHtml(c.nome || "")}" required></div>
      <div class="rs-field-row">
        <div class="rs-field"><label>${t("clientes.dataNascimento")}</label><input type="date" class="rs-input" id="f-dob" value="${c.dataNascimento || ""}"></div>
        <div class="rs-field"><label>${util.escapeHtml(cfg.labels.responsavel)}</label><input class="rs-input" id="f-resp" value="${util.escapeHtml(c.responsavel || "")}"></div>
      </div>
      <div class="rs-field-row">
        <div class="rs-field"><label>${t("comum.telefone")}</label><input class="rs-input" id="f-tel" value="${util.escapeHtml(c.telefone || "")}"></div>
        <div class="rs-field"><label>WhatsApp</label><input class="rs-input" id="f-whats" value="${util.escapeHtml(c.whatsapp || "")}"></div>
      </div>
      <div class="rs-field"><label>${t("comum.email")}</label><input type="email" class="rs-input" id="f-email" value="${util.escapeHtml(c.email || "")}"></div>
      <div class="rs-field"><label>${t("comum.endereco")}</label><input class="rs-input" id="f-end" value="${util.escapeHtml(c.endereco || "")}"></div>
      <div class="rs-field-row">
        <div class="rs-field"><label>${t("clientes.escolaInstituicao")}</label><input class="rs-input" id="f-escola" value="${util.escapeHtml(c.escola || "")}"></div>
        <div class="rs-field"><label>${t("clientes.profissao")}</label><input class="rs-input" id="f-prof" value="${util.escapeHtml(c.profissao || "")}"></div>
      </div>
      <div class="rs-field"><label>${util.escapeHtml(cfg.labels.diagnostico)} ${t("comum.opcional")}</label><textarea class="rs-textarea" id="f-diag">${util.escapeHtml(c.diagnostico || "")}</textarea></div>
      <div class="rs-field"><label>${util.escapeHtml(cfg.labels.objetivos)}</label><textarea class="rs-textarea" id="f-obj">${util.escapeHtml(c.objetivos || "")}</textarea></div>
      <div class="rs-field"><label>${t("comum.observacoes")}</label><textarea class="rs-textarea" id="f-obs">${util.escapeHtml(c.observacoes || "")}</textarea></div>
      <div class="rs-field-row">
        <div class="rs-field"><label>${t("clientes.dataInicio")}</label><input type="date" class="rs-input" id="f-inicio" value="${c.dataInicio || util.toLocalDateStr()}"></div>
        <div class="rs-field"><label>${t("comum.status")}</label>
          <select class="rs-select" id="f-status">
            <option value="ativo" ${(c.status || "ativo") === "ativo" ? "selected" : ""}>${t("comum.ativo")}</option>
            <option value="inativo" ${c.status === "inativo" ? "selected" : ""}>${t("comum.inativo")}</option>
          </select>
        </div>
      </div>
    `;
    const footHtml = `
      <button class="rs-btn rs-btn-ghost" data-close>${t("comum.cancelar")}</button>
      <button class="rs-btn rs-btn-primary" id="f-save">${RS.icon("check", 14)} ${t("comum.salvar")}</button>
    `;
    const modal = RS.openModal({ title: existing ? t("clientes.editarTitulo", { singular: cfg.labels.cliente_singular.toLowerCase() }) : t("clientes.novoTitulo", { singular: cfg.labels.cliente_singular.toLowerCase() }), bodyHtml, footHtml, wide: true });

    modal.querySelector("#f-save").addEventListener("click", () => {
      const nome = modal.querySelector("#f-nome").value.trim();
      if (!nome) {
        RS.toast(t("clientes.informeNome"));
        return;
      }
      const data = {
        nome,
        dataNascimento: modal.querySelector("#f-dob").value,
        responsavel: modal.querySelector("#f-resp").value.trim(),
        telefone: modal.querySelector("#f-tel").value.trim(),
        whatsapp: modal.querySelector("#f-whats").value.trim(),
        email: modal.querySelector("#f-email").value.trim(),
        endereco: modal.querySelector("#f-end").value.trim(),
        escola: modal.querySelector("#f-escola").value.trim(),
        profissao: modal.querySelector("#f-prof").value.trim(),
        diagnostico: modal.querySelector("#f-diag").value.trim(),
        objetivos: modal.querySelector("#f-obj").value.trim(),
        observacoes: modal.querySelector("#f-obs").value.trim(),
        dataInicio: modal.querySelector("#f-inicio").value,
        status: modal.querySelector("#f-status").value,
      };
      if (existing) {
        const updated = storage.update(ENTITY, existing.id, data);
        if (!updated) return;
        RS.toast(t("clientes.cadastroAtualizado"));
      } else {
        const created = storage.create(ENTITY, data);
        if (!created) return;
        RS.toast(t("clientes.clienteCadastrado"));
        RS.closeModal();
        RS.router.navigate("clientes", created.id);
        return;
      }
      RS.closeModal();
      RS.router.render("clientes", existing.id);
    });
  }

  // ---------------------------------------------------------------- DETALHE
  let activeTab = "perfil";

  function renderDetail(container, id) {
    const t = RS.I18n.t;
    const c = storage.getById(ENTITY, id);
    if (!c) {
      container.innerHTML = `<div class="rs-empty">${RS.icon("users", 34)}<p>${t("clientes.registroNaoEncontrado")}</p>
        <button class="rs-btn rs-btn-ghost" id="rs-back">${t("comum.voltar")}</button></div>`;
      container.querySelector("#rs-back").addEventListener("click", () => RS.router.navigate("clientes"));
      return;
    }
    const cfg = RS.config;
    const a = age(c.dataNascimento);

    container.innerHTML = `
      <button class="rs-btn rs-btn-subtle" id="rs-back" style="margin-bottom:14px;">${RS.icon("chevronLeft", 14)} ${t("comum.voltar")}</button>
      <div class="rs-card" style="margin-bottom:16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
        <div class="rs-avatar" style="width:56px; height:56px; font-size:18px;">${util.initials(c.nome)}</div>
        <div style="flex:1; min-width:180px;">
          <h2 style="font-size:19px;">${util.escapeHtml(c.nome)}</h2>
          <div style="font-size:12.5px; color:var(--rs-ink-faint); margin-top:3px;">
            ${a != null ? a + " " + t("comum.anos") + " · " : ""}${util.escapeHtml(c.profissao || c.escola || "—")} · ${t("clientes.desde")} ${util.formatDate(c.dataInicio)}
          </div>
        </div>
        <span class="rs-badge ${c.status === "inativo" ? "rs-badge-gray" : "rs-badge-blue"}">${c.status === "inativo" ? t("comum.inativo") : t("comum.ativo")}</span>
        <button class="rs-btn rs-btn-ghost" id="rs-edit">${RS.icon("edit", 14)} ${t("comum.editar")}</button>
        <button class="rs-btn rs-btn-danger" id="rs-del">${RS.icon("trash", 14)}</button>
      </div>

      <div class="rs-tabs" id="rs-tabs">
        ${tab("perfil", t("clientes.tabPerfil"))}${tab("timeline", cfg.labels.atendimento_plural)}${tab("financeiro", t("clientes.tabFinanceiro"))}
      </div>
      <div id="rs-tab-content"></div>
    `;

    container.querySelector("#rs-back").addEventListener("click", () => RS.router.navigate("clientes"));
    container.querySelector("#rs-edit").addEventListener("click", () => openForm(c));
    container.querySelector("#rs-del").addEventListener("click", () => {
      if (confirm(t("clientes.confirmarExclusao", { nome: c.nome }))) {
        storage.remove(ENTITY, c.id);
        RS.toast(t("clientes.registroExcluido"));
        RS.router.navigate("clientes");
      }
    });

    container.querySelectorAll("[data-tab]").forEach((tEl) =>
      tEl.addEventListener("click", () => {
        activeTab = tEl.dataset.tab;
        renderDetail(container, id);
      })
    );

    renderTabContent(container.querySelector("#rs-tab-content"), c);

    function tab(id2, label) {
      return `<div class="rs-tab ${activeTab === id2 ? "is-active" : ""}" data-tab="${id2}">${label}</div>`;
    }
  }

  function renderTabContent(el, c) {
    if (activeTab === "perfil") return renderPerfil(el, c);
    if (activeTab === "timeline" && RS.modules.timeline) return RS.modules.timeline.renderForClient(el, c);
    if (activeTab === "documentos" && RS.modules.documentos) return RS.modules.documentos.renderForClient(el, c);
    if (activeTab === "financeiro" && RS.modules.financeiro) return RS.modules.financeiro.renderForClient(el, c);
  }

  function renderPerfil(el, c) {
    const cfg = RS.config;
    const t = RS.I18n.t;
    const rows = [
      [t("clientes.responsavelLabel"), c.responsavel],
      [t("comum.telefone"), c.telefone],
      ["WhatsApp", c.whatsapp],
      [t("comum.email"), c.email],
      [t("comum.endereco"), c.endereco],
      [t("clientes.escolaInstituicao"), c.escola],
      [t("clientes.profissao"), c.profissao],
    ];
    el.innerHTML = `
      <div class="rs-grid rs-grid-2">
        <div class="rs-card">
          <div class="rs-section-title">${t("clientes.dadosContato")}</div>
          ${rows.map(([l, v]) => fieldRow(l, v)).join("")}
        </div>
        <div class="rs-card">
          <div class="rs-section-title">${util.escapeHtml(cfg.labels.objetivos)}</div>
          <p style="font-size:13.5px; line-height:1.6; color:var(--rs-ink-soft);">${util.escapeHtml(c.objetivos) || "—"}</p>
          <div class="rs-section-title" style="margin-top:18px;">${util.escapeHtml(cfg.labels.diagnostico)}</div>
          <p style="font-size:13.5px; line-height:1.6; color:var(--rs-ink-soft);">${util.escapeHtml(c.diagnostico) || "—"}</p>
          <div class="rs-section-title" style="margin-top:18px;">${t("comum.observacoes")}</div>
          <p style="font-size:13.5px; line-height:1.6; color:var(--rs-ink-soft);">${util.escapeHtml(c.observacoes) || "—"}</p>
        </div>
      </div>
    `;
  }

  function fieldRow(label, value) {
    return `<div style="display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--rs-border-soft); font-size:13.5px;">
      <span style="color:var(--rs-ink-faint);">${label}</span><span style="font-weight:550;">${util.escapeHtml(value) || "—"}</span>
    </div>`;
  }

  RS.modules = RS.modules || {};
  RS.modules.clientes = { id: "clientes", i18nSubtitleKey: "shell.clientes.subtitulo", get label() { return RS.config.labels.cliente_plural; }, get subtitle() { return RS.I18n.t("shell.clientes.subtitulo"); }, render };
})(window);

/* ---- js/modules/timeline.js ---- */
(function (global) {
  "use strict";
  const RS = global.RS;
  const { storage, util } = RS;
  const ENTITY = "atendimentos";

  function renderForClient(el, cliente) {
    const cfg = RS.config;
    const t = RS.I18n.t;
    el.innerHTML = `
      <div style="display:flex; justify-content:flex-end; margin-bottom:14px;">
        <button class="rs-btn rs-btn-primary" id="rs-tl-new">${RS.icon("plus", 15)} ${t("timeline.registrar")} ${cfg.labels.atendimento_singular.toLowerCase()}</button>
      </div>
      <div id="rs-tl-list"></div>
    `;
    el.querySelector("#rs-tl-new").addEventListener("click", () => openForm(cliente, el));
    renderList(el, cliente);
  }

  function renderList(el, cliente) {
    const t = RS.I18n.t;
    const listEl = el.querySelector("#rs-tl-list");
    const items = storage
      .list(ENTITY)
      .filter((a) => a.clienteId === cliente.id)
      .sort((a, b) => new Date(b.data + "T" + (b.hora || "00:00")) - new Date(a.data + "T" + (a.hora || "00:00")));

    if (!items.length) {
      listEl.innerHTML = `<div class="rs-card"><div class="rs-empty">${RS.icon("clock", 34)}<p>${t("timeline.nenhumRegistro")}</p></div></div>`;
      return;
    }

    listEl.innerHTML = `<div class="rs-card">` + items.map((a) => itemHtml(a)).join("") + `</div>`;

    listEl.querySelectorAll("[data-edit]").forEach((b) =>
      b.addEventListener("click", () => openForm(cliente, el, storage.getById(ENTITY, b.dataset.edit)))
    );
    listEl.querySelectorAll("[data-del]").forEach((b) =>
      b.addEventListener("click", () => {
        if (confirm(t("timeline.confirmarExclusao"))) {
          storage.remove(ENTITY, b.dataset.del);
          RS.toast(t("timeline.registroRemovido"));
          renderList(el, cliente);
        }
      })
    );
  }

  function itemHtml(a) {
    const t = RS.I18n.t;
    return `
      <div class="rs-card-flat" style="margin-bottom:10px; position:relative;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
          <div>
            <span class="rs-badge rs-badge-lilac">${util.escapeHtml(a.tipo || t("timeline.sessao"))}</span>
            <span style="font-size:12px; color:var(--rs-ink-faint); margin-left:8px;">${util.formatDate(a.data)} ${a.hora ? "· " + a.hora : ""} ${a.duracaoMin ? "· " + a.duracaoMin + "min" : ""}</span>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="rs-btn rs-btn-subtle rs-btn-icon" data-edit="${a.id}">${RS.icon("edit", 14)}</button>
            <button class="rs-btn rs-btn-danger rs-btn-icon" data-del="${a.id}">${RS.icon("trash", 14)}</button>
          </div>
        </div>
        ${a.objetivos ? field(t("timeline.objetivosSessao"), a.objetivos) : ""}
        ${a.descricao ? field(t("timeline.descricao"), a.descricao) : ""}
        ${a.atividades ? field(t("timeline.atividades"), a.atividades) : ""}
        ${a.materiais ? field(t("timeline.materiaisUtilizados"), a.materiais) : ""}
        ${a.respostaCliente ? field(t("timeline.respostaObservada"), a.respostaCliente) : ""}
        ${a.proximosPassos ? field(t("timeline.proximosPassos"), a.proximosPassos) : ""}
        ${a.observacoes ? field(t("comum.observacoes"), a.observacoes) : ""}
      </div>`;
  }

  function field(label, value) {
    return `<div style="margin-top:8px; font-size:13px;"><strong style="color:var(--rs-ink-soft); font-weight:650;">${label}:</strong> ${util.escapeHtml(value)}</div>`;
  }

  function openForm(cliente, el, existing) {
    const cfg = RS.config;
    const t = RS.I18n.t;
    const a = existing || {};
    const tipos = cfg.tiposAtendimento || [];
    const bodyHtml = `
      <div class="rs-field-row">
        <div class="rs-field"><label>${t("timeline.data")}</label><input type="date" class="rs-input" id="t-data" value="${a.data || util.toLocalDateStr()}"></div>
        <div class="rs-field"><label>${t("timeline.hora")}</label><input type="time" class="rs-input" id="t-hora" value="${a.hora || ""}"></div>
