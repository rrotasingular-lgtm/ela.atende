        <div class="rs-field"><label>${t("timeline.tipo")}</label>
          <select class="rs-select" id="t-tipo">${tipos.map((tp) => `<option ${a.tipo === tp ? "selected" : ""}>${tp}</option>`).join("")}</select>
        </div>
      </div>
      <div class="rs-field"><label>${t("timeline.objetivosSessao")}</label><textarea class="rs-textarea" id="t-obj">${util.escapeHtml(a.objetivos || "")}</textarea></div>
      <div class="rs-field"><label>${t("timeline.descricaoAtendimento")}</label><textarea class="rs-textarea" id="t-desc">${util.escapeHtml(a.descricao || "")}</textarea></div>
      <div class="rs-field-row">
        <div class="rs-field"><label>${t("timeline.atividades")}</label><textarea class="rs-textarea" id="t-ativ">${util.escapeHtml(a.atividades || "")}</textarea></div>
        <div class="rs-field"><label>${t("timeline.materiaisUtilizados")}</label><textarea class="rs-textarea" id="t-mat">${util.escapeHtml(a.materiais || "")}</textarea></div>
      </div>
      <div class="rs-field"><label>${t("timeline.respostaObservada")}</label><textarea class="rs-textarea" id="t-resp">${util.escapeHtml(a.respostaCliente || "")}</textarea></div>
      <div class="rs-field"><label>${t("timeline.proximosPassos")}</label><textarea class="rs-textarea" id="t-prox">${util.escapeHtml(a.proximosPassos || "")}</textarea></div>
      <div class="rs-field"><label>${t("comum.observacoes")}</label><textarea class="rs-textarea" id="t-obs">${util.escapeHtml(a.observacoes || "")}</textarea></div>
    `;
    const footHtml = `<button class="rs-btn rs-btn-ghost" data-close>${t("comum.cancelar")}</button>
      <button class="rs-btn rs-btn-primary" id="t-save">${RS.icon("check", 14)} ${t("comum.salvar")}</button>`;
    const modal = RS.openModal({ title: existing ? t("timeline.editarRegistro") : t("timeline.registrar") + " " + cfg.labels.atendimento_singular.toLowerCase(), bodyHtml, footHtml, wide: true });

    modal.querySelector("#t-save").addEventListener("click", () => {
      const data = {
        clienteId: cliente.id,
        data: modal.querySelector("#t-data").value,
        hora: modal.querySelector("#t-hora").value,
        duracaoMin: Number(modal.querySelector("#t-dur").value) || 0,
        tipo: modal.querySelector("#t-tipo").value,
        objetivos: modal.querySelector("#t-obj").value.trim(),
        descricao: modal.querySelector("#t-desc").value.trim(),
        atividades: modal.querySelector("#t-ativ").value.trim(),
        materiais: modal.querySelector("#t-mat").value.trim(),
        respostaCliente: modal.querySelector("#t-resp").value.trim(),
        proximosPassos: modal.querySelector("#t-prox").value.trim(),
        observacoes: modal.querySelector("#t-obs").value.trim(),
      };
      if (!data.data) {
        RS.toast(t("timeline.informeData"));
        return;
      }
      const ok = existing ? storage.update(ENTITY, existing.id, data) : storage.create(ENTITY, data);
      if (!ok) return;
      RS.toast(t("timeline.registroSalvo"));
      RS.closeModal();
      renderList(el, cliente);
    });
  }

  RS.modules = RS.modules || {};
  RS.modules.timeline = { id: "timeline", label: "Timeline", renderForClient };
})(window);

/* ---- js/modules/agenda.js ---- */
(function (global) {
  "use strict";
  const RS = global.RS;
  const { storage, util } = RS;
  const ENTITY = "agenda";
  const STATUSES = ["confirmado", "realizado", "falta", "cancelado", "remarcado"];
  const STATUS_BADGE = { confirmado: "rs-badge-blue", realizado: "rs-badge-lilac", falta: "rs-badge-yellow", cancelado: "rs-badge-gray", remarcado: "rs-badge-pink" };
  function statusLabel(s) { return RS.I18n.t("agenda.status." + s) || s; }

  let cursor = new Date();
  cursor.setDate(1);

  function render(container) {
    const t = RS.I18n.t;
    container.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="rs-btn rs-btn-ghost rs-btn-icon" id="rs-ag-prev">${RS.icon("chevronLeft", 15)}</button>
          <div style="font-family:var(--font-display); font-weight:650; font-size:16px; min-width:170px; text-align:center; text-transform:capitalize;" id="rs-ag-label"></div>
          <button class="rs-btn rs-btn-ghost rs-btn-icon" id="rs-ag-next">${RS.icon("chevronRight", 15)}</button>
        </div>
        <button class="rs-btn rs-btn-primary" id="rs-ag-new">${RS.icon("plus", 15)} ${t("agenda.novoAgendamento")}</button>
      </div>
      <div class="rs-card">
        <div class="rs-cal-grid" id="rs-ag-grid"></div>
      </div>
    `;
    container.querySelector("#rs-ag-prev").addEventListener("click", () => { cursor.setMonth(cursor.getMonth() - 1); renderGrid(container); });
    container.querySelector("#rs-ag-next").addEventListener("click", () => { cursor.setMonth(cursor.getMonth() + 1); renderGrid(container); });
    container.querySelector("#rs-ag-new").addEventListener("click", () => openForm(null, () => renderGrid(container)));
    renderGrid(container);
  }

  function renderGrid(container) {
    container.querySelector("#rs-ag-label").textContent = cursor.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    const grid = container.querySelector("#rs-ag-grid");
    const events = storage.list(ENTITY);
    const year = cursor.getFullYear(), month = cursor.getMonth();
    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    const today = new Date();

    let cells = [];
    for (let i = firstDow - 1; i >= 0; i--) cells.push({ day: daysInPrevMonth - i, outside: true, date: new Date(year, month - 1, daysInPrevMonth - i) });
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, outside: false, date: new Date(year, month, d) });
    while (cells.length % 7 !== 0) {
      const d = cells.length - (firstDow + daysInMonth) + 1;
      cells.push({ day: d, outside: true, date: new Date(year, month + 1, d) });
    }

    const dow = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
    grid.innerHTML =
      dow.map((d) => `<div class="rs-cal-dow">${d}</div>`).join("") +
      cells
        .map((c) => {
          const dayEvents = events.filter((e) => e.data && isSameDay(new Date(e.data), c.date));
          const isToday = isSameDay(c.date, today);
          return `
          <div class="rs-cal-day ${c.outside ? "is-outside" : ""} ${isToday ? "is-today" : ""}" data-date="${util.toLocalDateStr(c.date)}">
            <div class="rs-cal-daynum">${c.day}</div>
            ${dayEvents
              .slice(0, 3)
              .map((e) => `<div class="rs-cal-evt" data-evt="${e.id}">${util.escapeHtml(e.titulo)}</div>`)
              .join("")}
            ${dayEvents.length > 3 ? `<div style="font-size:10px; color:var(--rs-ink-faint); margin-top:2px;">+${dayEvents.length - 3}</div>` : ""}
          </div>`;
        })
        .join("");

    grid.querySelectorAll(".rs-cal-day").forEach((cell) => {
      cell.addEventListener("click", () => openDayView(cell.dataset.date, container));
    });
  }

  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  // ---------------------------------------------------------------- DIA
  function openDayView(dateStr, container) {
    const t = RS.I18n.t;
    const clientesMap = {};
    storage.list("clientes").forEach((c) => (clientesMap[c.id] = c.nome));
    const events = storage
      .list(ENTITY)
      .filter((e) => e.data && e.data.slice(0, 10) === dateStr)
      .sort((a, b) => a.data.localeCompare(b.data));

    const dateObj = new Date(dateStr + "T00:00:00");
    const label = dateObj.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
    const labelCap = label.charAt(0).toUpperCase() + label.slice(1);
    const isToday = dateStr === util.toLocalDateStr(new Date());

    const bodyHtml =
      (events.length
        ? `<div style="font-size:12px; color:var(--rs-ink-faint); margin-bottom:10px;">${events.length} ${events.length === 1 ? t("agenda.agendamento") : t("agenda.agendamentos")}</div><div class="rs-day-agenda">` +
          events.map((e) => dayRowHtml(e, clientesMap)).join("") +
          `</div>`
        : `<div class="rs-empty">${RS.icon("calendar", 34)}<p>${t("agenda.nenhumNesteDia")}</p></div>`);

    const footHtml = `
      <button class="rs-btn rs-btn-ghost" data-close>${t("agenda.fechar")}</button>
      <button class="rs-btn rs-btn-primary" id="day-add">${RS.icon("plus", 14)} ${t("agenda.novoAgendamento")}</button>
    `;

    const modal = RS.openModal({ title: labelCap, bodyHtml, footHtml });
    if (isToday) {
      const h3 = modal.querySelector(".rs-modal-head h3");
      if (h3) h3.insertAdjacentHTML("beforeend", ` <span class="rs-badge rs-badge-blue" style="vertical-align:middle; margin-left:6px;">${t("agenda.hoje")}</span>`);
    }

    modal.querySelectorAll("[data-evt-row]").forEach((row) => {
      row.addEventListener("click", () => {
        const ev = storage.getById(ENTITY, row.dataset.evtRow);
        RS.closeModal();
        openForm(ev, () => renderGrid(container));
      });
    });

    modal.querySelector("#day-add").addEventListener("click", () => {
      RS.closeModal();
      openForm({ data: dateStr + "T09:00" }, () => renderGrid(container), true);
    });
  }

  function dayRowHtml(e, clientesMap) {
    const hora = e.data && e.data.includes("T") ? e.data.slice(11, 16) : "--:--";
    const cliente = e.clienteId && clientesMap[e.clienteId] ? clientesMap[e.clienteId] : null;
    return `
      <div class="rs-list-row" data-evt-row="${e.id}">
        <div class="rs-mono" style="width:52px; font-weight:650; font-size:13.5px; color:var(--rs-accent); flex-shrink:0;">${hora}</div>
        <div style="flex:1; min-width:0;">
          <div style="font-weight:600; font-size:13.5px;">${util.escapeHtml(e.titulo)}</div>
          <div style="font-size:12px; color:var(--rs-ink-faint);">${cliente ? util.escapeHtml(cliente) + " · " : ""}${e.duracaoMin ? e.duracaoMin + " min" : ""}</div>
        </div>
        <span class="rs-badge ${STATUS_BADGE[e.status] || "rs-badge-blue"}">${statusLabel(e.status || "confirmado")}</span>
      </div>`;
  }

  function openForm(existing, onSaved, isNewFromDay) {
    const cfg = RS.config;
    const t = RS.I18n.t;
    const e = (isNewFromDay ? existing : existing) || {};
    const clientes = storage.list("clientes").sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
    const dt = e.data ? new Date(e.data) : new Date();
    const dateVal = e.data ? e.data.slice(0, 10) : util.toLocalDateStr(dt);
    const timeVal = e.data && e.data.includes("T") ? e.data.slice(11, 16) : "09:00";

    const bodyHtml = `
      <div class="rs-field"><label>${t("agenda.titulo")}</label><input class="rs-input" id="a-titulo" value="${util.escapeHtml(e.titulo || "")}" placeholder="${t("agenda.tituloPlaceholder", { nome: clientes[0] ? util.escapeHtml(clientes[0].nome) : t("agenda.clienteGenerico") })}"></div>
      <div class="rs-field"><label>${cfg.labels.cliente_singular} ${t("agenda.opcional")}</label>
        <select class="rs-select" id="a-cliente">
          <option value="">${t("agenda.nenhum")}</option>
          ${clientes.map((c) => `<option value="${c.id}" ${e.clienteId === c.id ? "selected" : ""}>${util.escapeHtml(c.nome)}</option>`).join("")}
        </select>
      </div>
      <div class="rs-field-row">
        <div class="rs-field"><label>${t("agenda.data")}</label><input type="date" class="rs-input" id="a-data" value="${dateVal}"></div>
        <div class="rs-field"><label>${t("agenda.hora")}</label><input type="time" class="rs-input" id="a-hora" value="${timeVal}"></div>
      </div>
      <div class="rs-field-row">
        <div class="rs-field"><label>${t("timeline.duracaoMin")}</label><input type="number" class="rs-input" id="a-dur" value="${e.duracaoMin || 50}"></div>
        <div class="rs-field"><label>${t("comum.status")}</label>
          <select class="rs-select" id="a-status">${STATUSES.map((s) => `<option value="${s}" ${e.status === s ? "selected" : ""}>${statusLabel(s)}</option>`).join("")}</select>
        </div>
      </div>
      <div class="rs-field"><label>${t("agenda.notas")}</label><textarea class="rs-textarea" id="a-notas">${util.escapeHtml(e.notas || "")}</textarea></div>
    `;
    const footHtml = `
      ${e.id ? `<button class="rs-btn rs-btn-danger" id="a-del" style="margin-right:auto;">${RS.icon("trash", 14)} ${t("agenda.excluir")}</button>` : ""}
      <button class="rs-btn rs-btn-ghost" data-close>${t("comum.cancelar")}</button>
      <button class="rs-btn rs-btn-primary" id="a-save">${RS.icon("check", 14)} ${t("comum.salvar")}</button>
    `;
    const modal = RS.openModal({ title: e.id ? t("agenda.editarAgendamento") : t("agenda.novoAgendamento"), bodyHtml, footHtml });

    if (e.id) {
      modal.querySelector("#a-del").addEventListener("click", () => {
        if (confirm(t("agenda.confirmarExclusao"))) {
          storage.remove(ENTITY, e.id);
          RS.toast(t("agenda.agendamentoExcluido"));
          RS.closeModal();
          onSaved();
        }
      });
    }

    modal.querySelector("#a-save").addEventListener("click", () => {
      const titulo = modal.querySelector("#a-titulo").value.trim();
      const data = modal.querySelector("#a-data").value;
      if (!titulo || !data) {
        RS.toast(t("agenda.informeTituloData"));
        return;
      }
      const payload = {
        titulo,
        clienteId: modal.querySelector("#a-cliente").value || null,
        data: data + "T" + (modal.querySelector("#a-hora").value || "00:00"),
        duracaoMin: Number(modal.querySelector("#a-dur").value) || 0,
        status: modal.querySelector("#a-status").value,
        notas: modal.querySelector("#a-notas").value.trim(),
      };
      const ok = e.id ? storage.update(ENTITY, e.id, payload) : storage.create(ENTITY, payload);
      if (!ok) return;
      RS.toast(t("agenda.agendamentoSalvo"));
      RS.closeModal();
      onSaved();
    });
  }

  RS.modules = RS.modules || {};
  RS.modules.agenda = { id: "agenda", i18nKey: "nav.agenda", i18nSubtitleKey: "shell.agenda.subtitulo", get label() { return RS.I18n.t("nav.agenda"); }, get subtitle() { return RS.I18n.t("shell.agenda.subtitulo"); }, render };
})(window);

/* ---- js/modules/financeiro.js ---- */
(function (global) {
  "use strict";
  const RS = global.RS;
  const { storage, util } = RS;
  const ENTITY = "financeiro";
  function statusLabel(s) { return RS.I18n.t("financeiro.status." + s) || s; }

  function render(container) {
    renderInner(container, null);
  }

  function renderForClient(el, cliente) {
    renderInner(el, cliente);
  }

  function renderInner(container, cliente) {
    const cfg = RS.config;
    const t = RS.I18n.t;
    const all = storage.list(ENTITY).filter((f) => !cliente || f.clienteId === cliente.id);
    const now = new Date();
    const recebidoMes = all
      .filter((f) => f.tipo === "receita" && f.status === "pago" && f.data && sameMonth(new Date(f.data), now))
      .reduce((s, f) => s + Number(f.valor || 0), 0);
    const aReceber = all.filter((f) => f.tipo === "receita" && f.status === "pendente").reduce((s, f) => s + Number(f.valor || 0), 0);
    const despesasMes = all
      .filter((f) => f.tipo === "despesa" && f.data && sameMonth(new Date(f.data), now))
      .reduce((s, f) => s + Number(f.valor || 0), 0);

    container.innerHTML = `
      <div class="rs-grid rs-grid-3" style="margin-bottom:16px;">
        ${miniStat("blue", t("financeiro.recebidoMes"), util.formatCurrency(recebidoMes))}
        ${miniStat("yellow", t("dashboard.aReceber"), util.formatCurrency(aReceber))}
        ${miniStat("pink", t("financeiro.despesasMes"), util.formatCurrency(despesasMes))}
      </div>
      <div class="rs-card">
        <div class="rs-section-title">${t("financeiro.lancamentos")}
          <button class="rs-btn rs-btn-primary" id="rs-fin-new">${RS.icon("plus", 14)} ${t("financeiro.novoLancamento")}</button>
        </div>
        <div id="rs-fin-list"></div>
      </div>
    `;

    container.querySelector("#rs-fin-new").addEventListener("click", () => openForm(cliente, () => renderInner(container, cliente)));
    renderList(container, cliente);
  }

  function sameMonth(a, b) {
    return a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear();
  }

  function miniStat(color, label, value) {
    const map = { blue: "var(--rs-blue)", pink: "var(--rs-pink)", yellow: "var(--rs-yellow)", lilac: "var(--rs-lilac)" };
    return `<div class="rs-stat" style="--stat-color:${map[color]}">
      <div class="rs-stat-label"><span class="rs-stat-dot"></span>${label}</div>
      <div class="rs-stat-value" style="font-size:22px;">${value}</div>
    </div>`;
  }

  function renderList(container, cliente) {
    const t = RS.I18n.t;
    const listEl = container.querySelector("#rs-fin-list");
    const clientesMap = {};
    storage.list("clientes").forEach((c) => (clientesMap[c.id] = c.nome));
    const items = storage
      .list(ENTITY)
      .filter((f) => !cliente || f.clienteId === cliente.id)
      .sort((a, b) => new Date(b.data) - new Date(a.data));

    if (!items.length) {
      listEl.innerHTML = `<div class="rs-empty">${RS.icon("wallet", 34)}<p>${t("financeiro.nenhumLancamento")}</p></div>`;
      return;
    }

    listEl.innerHTML = items
      .map(
        (f) => `
      <div class="rs-list-row" data-edit="${f.id}">
        <div class="rs-avatar">${RS.icon(f.tipo === "despesa" ? "wallet" : "wallet", 16)}</div>
        <div style="flex:1; min-width:0;">
          <div style="font-weight:600; font-size:13.5px;">${util.escapeHtml(f.descricao || f.categoria)}</div>
          <div style="font-size:12px; color:var(--rs-ink-faint);">${util.formatDate(f.data)} ${f.clienteId && clientesMap[f.clienteId] ? "· " + util.escapeHtml(clientesMap[f.clienteId]) : ""}</div>
        </div>
        <span class="rs-badge ${f.status === "pago" ? "rs-badge-blue" : "rs-badge-yellow"}">${statusLabel(f.status)}</span>
        <span class="rs-mono" style="font-weight:650; font-size:13.5px; min-width:90px; text-align:right; color:${f.tipo === "despesa" ? "#C23E70" : "var(--rs-ink)"}">
          ${f.tipo === "despesa" ? "− " : ""}${util.formatCurrency(f.valor)}
        </span>
      </div>`
      )
      .join("");

    listEl.querySelectorAll("[data-edit]").forEach((row) =>
      row.addEventListener("click", () => openForm(cliente, () => renderInner(container, cliente), storage.getById(ENTITY, row.dataset.edit)))
    );
  }

  function openForm(cliente, onSaved, existing) {
    const cfg = RS.config;
    const t = RS.I18n.t;
    const f = existing || {};
    const clientes = storage.list("clientes").sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
    const cats = cfg.categoriasFinanceiras || [];

    const bodyHtml = `
      <div class="rs-field-row">
        <div class="rs-field"><label>${t("financeiro.tipo")}</label>
          <select class="rs-select" id="fn-tipo">
            <option value="receita" ${(f.tipo || "receita") === "receita" ? "selected" : ""}>${t("financeiro.receita")}</option>
            <option value="despesa" ${f.tipo === "despesa" ? "selected" : ""}>${t("financeiro.despesa")}</option>
          </select>
        </div>
        <div class="rs-field"><label>${t("financeiro.categoria")}</label>
          <select class="rs-select" id="fn-cat">${cats.map((c) => `<option ${f.categoria === c ? "selected" : ""}>${c}</option>`).join("")}</select>
        </div>
      </div>
      ${!cliente ? `<div class="rs-field"><label>${cfg.labels.cliente_singular} ${t("agenda.opcional")}</label>
        <select class="rs-select" id="fn-cliente"><option value="">${t("agenda.nenhum")}</option>
          ${clientes.map((c) => `<option value="${c.id}" ${f.clienteId === c.id ? "selected" : ""}>${util.escapeHtml(c.nome)}</option>`).join("")}
        </select></div>` : ""}
      <div class="rs-field-row">
        <div class="rs-field"><label>${t("financeiro.valor")}</label><input type="number" step="0.01" min="0" class="rs-input" id="fn-valor" value="${f.valor || ""}"></div>
        <div class="rs-field"><label>${t("agenda.data")}</label><input type="date" class="rs-input" id="fn-data" value="${f.data || util.toLocalDateStr()}"></div>
      </div>
      <div class="rs-field"><label>${t("comum.status")}</label>
        <select class="rs-select" id="fn-status">
          <option value="pendente" ${(f.status || "pendente") === "pendente" ? "selected" : ""}>${t("financeiro.pendente")}</option>
          <option value="pago" ${f.status === "pago" ? "selected" : ""}>${t("financeiro.pago")}</option>
        </select>
      </div>
      <div class="rs-field"><label>${t("financeiro.descricao")}</label><input class="rs-input" id="fn-desc" value="${util.escapeHtml(f.descricao || "")}"></div>
    `;
    const footHtml = `
      ${f.id ? `<button class="rs-btn rs-btn-danger" id="fn-del" style="margin-right:auto;">${RS.icon("trash", 14)} ${t("financeiro.excluir")}</button>` : ""}
      <button class="rs-btn rs-btn-ghost" data-close>${t("comum.cancelar")}</button>
      <button class="rs-btn rs-btn-primary" id="fn-save">${RS.icon("check", 14)} ${t("comum.salvar")}</button>
    `;
    const modal = RS.openModal({ title: f.id ? t("financeiro.editarLancamento") : t("financeiro.novoLancamento"), bodyHtml, footHtml });

    if (f.id) {
      modal.querySelector("#fn-del").addEventListener("click", () => {
        if (confirm(t("financeiro.confirmarExclusao"))) {
          storage.remove(ENTITY, f.id);
          RS.toast(t("financeiro.lancamentoExcluido"));
          RS.closeModal();
          onSaved();
        }
      });
    }

    modal.querySelector("#fn-save").addEventListener("click", () => {
      const valor = Number(modal.querySelector("#fn-valor").value);
      const data = modal.querySelector("#fn-data").value;
      if (!valor || !data) {
        RS.toast(t("financeiro.informeValorData"));
        return;
      }
      const payload = {
        tipo: modal.querySelector("#fn-tipo").value,
        categoria: modal.querySelector("#fn-cat").value,
        clienteId: cliente ? cliente.id : (modal.querySelector("#fn-cliente") ? modal.querySelector("#fn-cliente").value || null : null),
        valor,
        data,
        status: modal.querySelector("#fn-status").value,
        descricao: modal.querySelector("#fn-desc").value.trim(),
      };
      const ok = f.id ? storage.update(ENTITY, f.id, payload) : storage.create(ENTITY, payload);
      if (!ok) return;
      RS.toast(t("financeiro.lancamentoSalvo"));
      RS.closeModal();
      onSaved();
    });
  }

  RS.modules = RS.modules || {};
  RS.modules.financeiro = { id: "financeiro", i18nKey: "nav.financeiro", i18nSubtitleKey: "shell.financeiro.subtitulo", get label() { return RS.I18n.t("nav.financeiro"); }, get subtitle() { return RS.I18n.t("shell.financeiro.subtitulo"); }, render, renderForClient };
})(window);

/* ---- js/modules/documentos.js ---- */
(function (global) {
  "use strict";
  const RS = global.RS;
  const { storage, util } = RS;
  const ENTITY = "documentos";
  const TIPOS = ["PDF", "Imagem", "Relatório", "Avaliação", "Plano", "Outro"];
  const MAX_FILE_BYTES = 700 * 1024; // limite de segurança para não estourar a cota do LocalStorage

  function render(container) {
    renderInner(container, null);
  }
  function renderForClient(el, cliente) {
    renderInner(el, cliente);
  }

  function renderInner(container, cliente) {
    container.innerHTML = `
      <div style="display:flex; justify-content:flex-end; margin-bottom:14px;">
        <button class="rs-btn rs-btn-primary" id="rs-doc-new">${RS.icon("plus", 15)} Novo documento</button>
      </div>
      <div class="rs-card" id="rs-doc-list"></div>
    `;
    container.querySelector("#rs-doc-new").addEventListener("click", () => openForm(cliente, () => renderInner(container, cliente)));
    renderList(container, cliente);
  }

  function renderList(container, cliente) {
    const listEl = container.querySelector("#rs-doc-list");
    const clientesMap = {};
    storage.list("clientes").forEach((c) => (clientesMap[c.id] = c.nome));
    const items = storage
      .list(ENTITY)
      .filter((d) => !cliente || d.clienteId === cliente.id)
      .sort((a, b) => new Date(b.data) - new Date(a.data));

    if (!items.length) {
      listEl.innerHTML = `<div class="rs-empty">${RS.icon("folder", 34)}<p>Nenhum documento anexado ainda.</p></div>`;
      return;
    }

    listEl.innerHTML = items
      .map(
        (d) => `
      <div class="rs-list-row" data-open="${d.id}">
        <div class="rs-avatar">${RS.icon("file", 16)}</div>
        <div style="flex:1; min-width:0;">
          <div style="font-weight:600; font-size:13.5px;">${util.escapeHtml(d.titulo)}</div>
          <div style="font-size:12px; color:var(--rs-ink-faint);">${util.formatDate(d.data)} ${d.clienteId && clientesMap[d.clienteId] ? "· " + util.escapeHtml(clientesMap[d.clienteId]) : ""}</div>
        </div>
        <span class="rs-badge rs-badge-gray">${util.escapeHtml(d.tipo)}</span>
        ${d.arquivoDataUrl ? `<a class="rs-btn rs-btn-ghost rs-btn-icon" href="${d.arquivoDataUrl}" download="${util.escapeHtml(d.arquivoNome || d.titulo)}" title="Baixar" data-download>${RS.icon("upload", 14)}</a>` : ""}
      </div>`
      )
      .join("");

    listEl.querySelectorAll("[data-open]").forEach((row) =>
      row.addEventListener("click", (e) => {
        if (e.target.closest("[data-download]")) return;
        openForm(cliente, () => renderInner(container, cliente), storage.getById(ENTITY, row.dataset.open));
      })
    );
  }

  function openForm(cliente, onSaved, existing) {
    const cfg = RS.config;
    const d = existing || {};
    const clientes = storage.list("clientes").sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));

    const bodyHtml = `
      <div class="rs-field"><label>Título *</label><input class="rs-input" id="dc-titulo" value="${util.escapeHtml(d.titulo || "")}"></div>
      <div class="rs-field-row">
        <div class="rs-field"><label>Tipo</label><select class="rs-select" id="dc-tipo">${TIPOS.map((t) => `<option ${d.tipo === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>
        <div class="rs-field"><label>Data</label><input type="date" class="rs-input" id="dc-data" value="${d.data || util.toLocalDateStr()}"></div>
      </div>
      ${!cliente ? `<div class="rs-field"><label>${cfg.labels.cliente_singular} (opcional)</label>
        <select class="rs-select" id="dc-cliente"><option value="">— nenhum —</option>
          ${clientes.map((c) => `<option value="${c.id}" ${d.clienteId === c.id ? "selected" : ""}>${util.escapeHtml(c.nome)}</option>`).join("")}
        </select></div>` : ""}
      <div class="rs-field"><label>Arquivo (opcional, até 700 KB)</label><input type="file" class="rs-input" id="dc-file"></div>
      ${d.arquivoNome ? `<div style="font-size:12px; color:var(--rs-ink-faint); margin:-6px 0 12px;">Atual: ${util.escapeHtml(d.arquivoNome)}</div>` : ""}
      <div class="rs-field"><label>Nota</label><textarea class="rs-textarea" id="dc-nota">${util.escapeHtml(d.nota || "")}</textarea></div>
    `;
    const footHtml = `
      ${d.id ? `<button class="rs-btn rs-btn-danger" id="dc-del" style="margin-right:auto;">${RS.icon("trash", 14)} Excluir</button>` : ""}
      <button class="rs-btn rs-btn-ghost" data-close>Cancelar</button>
      <button class="rs-btn rs-btn-primary" id="dc-save">${RS.icon("check", 14)} Salvar</button>
    `;
    const modal = RS.openModal({ title: d.id ? "Editar documento" : "Novo documento", bodyHtml, footHtml });

    if (d.id) {
      modal.querySelector("#dc-del").addEventListener("click", () => {
        if (confirm("Excluir este documento?")) {
          storage.remove(ENTITY, d.id);
          RS.toast("Documento excluído.");
          RS.closeModal();
          onSaved();
        }
      });
    }

    modal.querySelector("#dc-save").addEventListener("click", () => {
      const titulo = modal.querySelector("#dc-titulo").value.trim();
      if (!titulo) {
        RS.toast("Informe um título.");
        return;
      }
      const fileInput = modal.querySelector("#dc-file");
      const file = fileInput && fileInput.files && fileInput.files[0];

      const finalize = (arquivoNome, arquivoDataUrl) => {
        const payload = {
          titulo,
          tipo: modal.querySelector("#dc-tipo").value,
          data: modal.querySelector("#dc-data").value,
          clienteId: cliente ? cliente.id : (modal.querySelector("#dc-cliente") ? modal.querySelector("#dc-cliente").value || null : null),
          nota: modal.querySelector("#dc-nota").value.trim(),
          arquivoNome: arquivoNome !== undefined ? arquivoNome : d.arquivoNome,
          arquivoDataUrl: arquivoDataUrl !== undefined ? arquivoDataUrl : d.arquivoDataUrl,
        };
        const ok = d.id ? storage.update(ENTITY, d.id, payload) : storage.create(ENTITY, payload);
        if (!ok) return;
        RS.toast("Documento salvo.");
        RS.closeModal();
        onSaved();
      };

      if (file) {
        if (file.size > MAX_FILE_BYTES) {
          RS.toast("Arquivo muito grande para armazenamento local. Salvando apenas os dados do documento.");
          finalize(file.name, undefined);
          return;
        }
        const reader = new FileReader();
        reader.onload = () => finalize(file.name, reader.result);
        reader.readAsDataURL(file);
      } else {
        finalize(undefined, undefined);
      }
    });
  }

  RS.modules = RS.modules || {};
  RS.modules.documentos = { id: "documentos", label: "Documentos", subtitle: "Arquivos, avaliações e relatórios anexados", render, renderForClient };
})(window);


/* ---- js/modules/relatorios.js ---- */
(function (global) {
  "use strict";
  const RS = global.RS;
  const { storage, util } = RS;

  function render(container) {
    const cfg = RS.config;
    const t = RS.I18n.t;
    const clientes = storage.list("clientes").sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
    const today = new Date();
    const firstOfMonth = util.toLocalDateStr(new Date(today.getFullYear(), today.getMonth(), 1));
    const todayStr = util.toLocalDateStr(today);

    container.innerHTML = `
      <div class="rs-card rs-no-print" style="margin-bottom:18px;">
        <div class="rs-section-title">${t("relatorios.gerarRelatorio")}</div>
        <div class="rs-field-row">
          <div class="rs-field"><label>${cfg.labels.cliente_singular}</label>
            <select class="rs-select" id="rp-cliente">
              <option value="">${t("relatorios.todos", { plural: cfg.labels.cliente_plural.toLowerCase() })}</option>
              ${clientes.map((c) => `<option value="${c.id}">${util.escapeHtml(c.nome)}</option>`).join("")}
            </select>
          </div>
          <div class="rs-field"><label>${t("timeline.tipo")}</label>
            <select class="rs-select" id="rp-tipo">
              <option value="resumo">${t("relatorios.resumoCliente")}</option>
              <option value="periodo">${t("relatorios.porPeriodo")}</option>
              <option value="mensal">${t("relatorios.mensal")}</option>
              <option value="historico">${t("relatorios.historicoCompleto")}</option>
            </select>
          </div>
        </div>
        <div class="rs-field-row" id="rp-periodo">
          <div class="rs-field"><label>${t("relatorios.de")}</label><input type="date" class="rs-input" id="rp-de" value="${firstOfMonth}"></div>
          <div class="rs-field"><label>${t("relatorios.ate")}</label><input type="date" class="rs-input" id="rp-ate" value="${todayStr}"></div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="rs-btn rs-btn-primary" id="rp-gerar">${RS.icon("chart", 14)} ${t("relatorios.gerarRelatorio")}</button>
          <button class="rs-btn rs-btn-ghost" id="rp-print" style="display:none;">${RS.icon("printer", 14)} ${t("relatorios.exportarImprimir")}</button>
        </div>
      </div>
      <div id="rp-output"></div>
    `;

    container.querySelector("#rp-tipo").addEventListener("change", (e) => {
      container.querySelector("#rp-periodo").style.display = e.target.value === "resumo" ? "none" : "grid";
    });
    container.querySelector("#rp-gerar").addEventListener("click", () => {
      generate(container);
      container.querySelector("#rp-print").style.display = "inline-flex";
    });
    container.querySelector("#rp-print").addEventListener("click", () => window.print());
  }

  function generate(container) {
    const cfg = RS.config;
    const t = RS.I18n.t;
    const clienteId = container.querySelector("#rp-cliente").value;
    const tipo = container.querySelector("#rp-tipo").value;
    const de = container.querySelector("#rp-de").value;
    const ate = container.querySelector("#rp-ate").value;
    const output = container.querySelector("#rp-output");

    const clientes = clienteId ? [storage.getById("clientes", clienteId)] : storage.list("clientes");
    const atendimentos = storage.list("atendimentos");
    const financeiro = storage.list("financeiro");

    const inRange = (dataStr) => {
      if (tipo === "resumo") return true;
      if (!dataStr) return false;
      if (de && dataStr < de) return false;
      if (ate && dataStr > ate) return false;
      return true;
    };

    const blocks = clientes
      .filter(Boolean)
      .map((c) => {
        const atsCliente = atendimentos.filter((a) => a.clienteId === c.id && inRange(a.data)).sort((a, b) => new Date(a.data) - new Date(b.data));
        const finCliente = financeiro.filter((f) => f.clienteId === c.id && inRange(f.data));
        const totalPago = finCliente.filter((f) => f.tipo === "receita" && f.status === "pago").reduce((s, f) => s + Number(f.valor || 0), 0);
        const totalPendente = finCliente.filter((f) => f.tipo === "receita" && f.status === "pendente").reduce((s, f) => s + Number(f.valor || 0), 0);

        return `
        <div class="rs-card" style="margin-bottom:16px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
            <div>
              <h3 style="font-size:16px;">${util.escapeHtml(c.nome)}</h3>
              <div style="font-size:12px; color:var(--rs-ink-faint); margin-top:2px;">${util.escapeHtml(c.profissao || c.escola || "")} · ${t("clientes.desde")} ${util.formatDate(c.dataInicio)}</div>
            </div>
            <span class="rs-badge rs-badge-blue">${atsCliente.length} ${cfg.labels.atendimento_plural.toLowerCase()}</span>
          </div>
          ${tipo === "resumo" ? `
            <div style="font-size:13px; line-height:1.6; margin-bottom:10px;"><strong>${util.escapeHtml(cfg.labels.objetivos)}:</strong> ${util.escapeHtml(c.objetivos) || "—"}</div>
            <div style="font-size:13px; line-height:1.6; margin-bottom:10px;"><strong>${util.escapeHtml(cfg.labels.diagnostico)}:</strong> ${util.escapeHtml(c.diagnostico) || "—"}</div>
          ` : ""}
          <div style="font-size:13px; color:var(--rs-ink-soft); margin-bottom:6px;">${t("relatorios.recebido")}: <strong>${util.formatCurrency(totalPago)}</strong> · ${t("relatorios.pendente")}: <strong>${util.formatCurrency(totalPendente)}</strong></div>
          ${atsCliente.length ? `
            <table style="width:100%; border-collapse:collapse; margin-top:10px; font-size:12.5px;">
              <thead><tr style="text-align:left; color:var(--rs-ink-faint);"><th style="padding:6px 4px;">${t("relatorios.data")}</th><th style="padding:6px 4px;">${t("timeline.tipo")}</th><th style="padding:6px 4px;">${t("relatorios.objetivos")}</th><th style="padding:6px 4px;">${t("comum.observacoes")}</th></tr></thead>
              <tbody>
                ${atsCliente
                  .map(
                    (a) => `<tr style="border-top:1px solid var(--rs-border-soft);">
                  <td style="padding:6px 4px; white-space:nowrap;">${util.formatDate(a.data)}</td>
                  <td style="padding:6px 4px; white-space:nowrap;">${util.escapeHtml(a.tipo || "")}</td>
                  <td style="padding:6px 4px;">${util.escapeHtml(a.objetivos || "—")}</td>
                  <td style="padding:6px 4px;">${util.escapeHtml(a.observacoes || a.proximosPassos || "—")}</td>
                </tr>`
                  )
                  .join("")}
              </tbody>
            </table>` : `<p style="font-size:12.5px; color:var(--rs-ink-faint);">${t("relatorios.nenhumNoPeriodo")}</p>`}
        </div>`;
      })
      .join("");

    output.innerHTML = `
      <div class="rs-card" style="margin-bottom:16px; background:var(--rs-gray-light); border:none; box-shadow:none;">
        <div style="font-family:var(--font-display); font-weight:650; font-size:15px;">${util.escapeHtml(cfg.marca.nome)}</div>
        <div style="font-size:12px; color:var(--rs-ink-faint); margin-top:2px;">
          ${util.escapeHtml(cfg.profissional.nome || "")} ${cfg.profissional.especialidade ? "· " + util.escapeHtml(cfg.profissional.especialidade) : ""} · ${t("relatorios.emitidoEm")} ${util.formatDate(new Date().toISOString())}
          ${tipo !== "resumo" ? " · " + t("relatorios.periodo") + ": " + util.formatDate(de) + " a " + util.formatDate(ate) : ""}
        </div>
      </div>
      ${blocks || `<div class="rs-empty">${RS.icon("chart", 34)}<p>${t("relatorios.nenhumDado")}</p></div>`}
    `;
  }

  RS.modules = RS.modules || {};
  RS.modules.relatorios = { id: "relatorios", i18nKey: "nav.relatorios", i18nSubtitleKey: "shell.relatorios.subtitulo", get label() { return RS.I18n.t("nav.relatorios"); }, get subtitle() { return RS.I18n.t("shell.relatorios.subtitulo"); }, render };
})(window);

    `;

    renderUsage(container.querySelector("#cf-usage"));
    renderChipList(container.querySelector("#cf-tipos"), cfg.tiposAtendimento, (list) => cfg.save({ tiposAtendimento: list }));
    renderChipList(container.querySelector("#cf-cats"), cfg.categoriasFinanceiras, (list) => cfg.save({ categoriasFinanceiras: list }));

    container.querySelector("#cf-tipo-add").addEventListener("click", () => addChip(container, "#cf-tipo-new", "tiposAtendimento", "#cf-tipos"));
    container.querySelector("#cf-cat-add").addEventListener("click", () => addChip(container, "#cf-cat-new", "categoriasFinanceiras", "#cf-cats"));

    container.querySelectorAll("[data-swatch]").forEach((sw) =>
      sw.addEventListener("click", () => {
        container.querySelectorAll("[data-swatch]").forEach((s) => s.style.outline = "none");
        sw.style.outline = "2px solid var(--rs-ink)";
        sw.dataset.selected = "1";
        container.querySelectorAll("[data-swatch]").forEach((s) => { if (s !== sw) delete s.dataset.selected; });
      })
    );

    container.querySelector("#cf-save-prof").addEventListener("click", () => {
      const chosen = container.querySelector("[data-swatch][data-selected]");
      cfg.save({
        profissional: {
          nome: container.querySelector("#cf-nome").value.trim(),
          especialidade: container.querySelector("#cf-esp").value.trim(),
          corPrincipal: chosen ? chosen.dataset.swatch : cfg.profissional.corPrincipal,
        },
      });
      RS.toast(RS.I18n.t("config.identidadeAtualizada"));
      location.reload();
    });

    container.querySelector("#cf-save-lab").addEventListener("click", () => {
      cfg.save({
        labels: {
          cliente_singular: container.querySelector("#cf-lab-cs").value.trim() || RS.I18n.t("config.clienteDefault"),
          cliente_plural: container.querySelector("#cf-lab-cp").value.trim() || RS.I18n.t("config.clientesDefault"),
          atendimento_singular: container.querySelector("#cf-lab-as").value.trim() || RS.I18n.t("config.atendimentoDefault"),
          atendimento_plural: container.querySelector("#cf-lab-ap").value.trim() || RS.I18n.t("config.atendimentosDefault"),
        },
      });
      RS.toast(RS.I18n.t("config.terminologiaAtualizada"));
      location.reload();
    });

    const logoutBtn = container.querySelector("#cf-logout");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        if (!confirm(RS.I18n.t("minhaConta.confirmarSaida"))) return;
        RS.gate.limparContaAtiva();
        location.reload();
      });
    }

    const minhaContaBtn = container.querySelector("#cf-minha-conta");
    if (minhaContaBtn) {
      minhaContaBtn.addEventListener("click", abrirMinhaConta);
    }

    const connBadge = container.querySelector("#cf-conn-badge");
    if (connBadge) connBadge.innerHTML = renderConnBadgeHtml();

    container.querySelector("#cf-guia").addEventListener("click", abrirGuia);
    container.querySelector("#cf-privacidade").addEventListener("click", abrirPrivacidade);

    container.querySelector("#cf-export").addEventListener("click", () => {
      const dump = storage.exportAll(["clientes", "atendimentos", "agenda", "financeiro", "documentos"]);
      const blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "backup-ela-atende-" + util.toLocalDateStr() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      RS.toast(RS.I18n.t("config.backupExportado"));
    });

    const importInput = container.querySelector("#cf-import-file");
    container.querySelector("#cf-import").addEventListener("click", () => importInput.click());
    importInput.addEventListener("change", () => {
      const file = importInput.files && importInput.files[0];
      if (!file) return;
      if (!confirm(RS.I18n.t("config.confirmarImportar"))) {
        importInput.value = "";
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        let parsed;
        try {
          parsed = JSON.parse(reader.result);
        } catch (e) {
          RS.toast(RS.I18n.t("config.ficheiroInvalido"));
          return;
        }
        const res = storage.importAll(parsed);
        if (!res.ok) {
          RS.toast(res.reason || RS.I18n.t("config.falhaImportar"));
          return;
        }
        RS.toast(RS.I18n.t("config.backupImportado"));
        renderUsage(container.querySelector("#cf-usage"));
      };
      reader.readAsText(file);
      importInput.value = "";
    });
  }

  function syncStatusText() {
    const ok = RS.sync.estaSincronizado();
    return ok ? RS.I18n.t("sync.sincronizado") : RS.I18n.t("sync.aSincronizar");
  }

  // Pontinho + rótulo minúsculo (ON-LINE / OFF-LINE) — conectividade real
  // do navegador, separado do estado de sincronização acima.
  function renderConnBadgeHtml() {
    const online = typeof navigator !== "undefined" ? navigator.onLine !== false : true;
    const cor = online ? "#2FA84F" : "#B4B4B4";
    const texto = online ? RS.I18n.t("sync.online") : RS.I18n.t("sync.offline");
    return `<span style="width:7px; height:7px; border-radius:50%; background:${cor}; display:inline-block;"></span>` +
      `<span style="font-size:10px; font-weight:700; letter-spacing:.04em; color:${cor};">${texto}</span>`;
  }

  // Um único listener global (nunca se acumula, mesmo entrando e saindo
  // de Configurações repetidas vezes) — só atualiza o badge se ele
  // estiver montado na tela neste momento.
  if (typeof window.addEventListener === "function") {
    const atualizarConnBadgeSeVisivel = () => {
      const el = document.getElementById("cf-conn-badge");
      if (el) el.innerHTML = renderConnBadgeHtml();
    };
    window.addEventListener("online", atualizarConnBadgeSeVisivel);
    window.addEventListener("offline", atualizarConnBadgeSeVisivel);
  }

      <div class="rs-field">
        <label data-i18n="minhaConta.idioma.titulo">${t("minhaConta.idioma.titulo")}</label>
        <div style="display:flex; gap:8px;">
          <button type="button" class="rs-btn ${idiomaAtual === "pt-PT" ? "rs-btn-primary" : "rs-btn-ghost"}" id="mc-idioma-pt" data-i18n="minhaConta.idioma.pt-PT">${t("minhaConta.idioma.pt-PT")}</button>
          <button type="button" class="rs-btn ${idiomaAtual === "pt-BR" ? "rs-btn-primary" : "rs-btn-ghost"}" id="mc-idioma-br" data-i18n="minhaConta.idioma.pt-BR">${t("minhaConta.idioma.pt-BR")}</button>
        </div>
      </div>
      <p id="mc-error" style="display:none; color:#D64545; font-size:13px; margin-top:4px;"></p>
    `;
    const footHtml = `<button class="rs-btn rs-btn-primary" id="mc-salvar" data-i18n="minhaConta.guardar">${t("minhaConta.guardar")}</button>`;

    const modal = RS.openModal({ title: t("minhaConta.titulo"), bodyHtml, footHtml });
    modal.querySelector(".rs-modal-head h3").setAttribute("data-i18n", "minhaConta.titulo");

    modal.querySelector("#mc-idioma-pt").addEventListener("click", () => {
      RS.I18n.definirIdioma("pt-PT");
      modal.querySelector("#mc-idioma-pt").classList.add("rs-btn-primary");
      modal.querySelector("#mc-idioma-pt").classList.remove("rs-btn-ghost");
      modal.querySelector("#mc-idioma-br").classList.add("rs-btn-ghost");
      modal.querySelector("#mc-idioma-br").classList.remove("rs-btn-primary");
    });
    modal.querySelector("#mc-idioma-br").addEventListener("click", () => {
      RS.I18n.definirIdioma("pt-BR");
      modal.querySelector("#mc-idioma-br").classList.add("rs-btn-primary");
      modal.querySelector("#mc-idioma-br").classList.remove("rs-btn-ghost");
      modal.querySelector("#mc-idioma-pt").classList.add("rs-btn-ghost");
      modal.querySelector("#mc-idioma-pt").classList.remove("rs-btn-primary");
    });

    const userInput = modal.querySelector("#mc-user");
    userInput.addEventListener("input", function () {
      let v = this.value.toLowerCase().replace(/^ela\.+/, "").replace(/[^a-z0-9.]/g, "");
      this.value = v;
    });

    modal.querySelector("#mc-salvar").addEventListener("click", () => {
      const errEl = modal.querySelector("#mc-error");
      function mostrarErro(msg) { errEl.textContent = msg; errEl.style.display = "block"; }

      const novoEmail = (modal.querySelector("#mc-email").value || "").trim().toLowerCase();
      const novoSufixo = (modal.querySelector("#mc-user").value || "").trim();
      const novoUsuario = novoSufixo ? "ela." + novoSufixo : "";
      const novoPin = (modal.querySelector("#mc-pin").value || "").trim();

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(novoEmail)) { mostrarErro(t("minhaConta.erro.emailInvalido")); return; }
      if (!novoUsuario) { mostrarErro(t("minhaConta.erro.utilizadorObrigatorio")); return; }
      if (novoPin && !/^\d{4}$/.test(novoPin)) { mostrarErro(t("minhaConta.erro.pinInvalido")); return; }

      const btn = modal.querySelector("#mc-salvar");
      btn.disabled = true;
      btn.textContent = t("minhaConta.aGuardar");

      RS.syncLoadSupabase((client) => {
        const updates = {};
        if (novoEmail && novoEmail !== emailAtual) updates.email = novoEmail;
        if (novoPin) updates.password = "ela-pin-" + novoPin;

        function atualizarPerfilEFinalizar() {
          if (novoUsuario === labelAtual) { finalizar(); return; }
          client.from("profiles").update({ label: novoUsuario }).eq("id", conta.userId).then((res) => {
            if (res.error) {
              mostrarErro(t("minhaConta.erro.falhaUtilizador") + " (" + res.error.message + ").");
              btn.disabled = false; btn.textContent = t("minhaConta.guardar");
              return;
            }
            finalizar();
          }).catch((e) => {
            mostrarErro(t("minhaConta.erro.redeGenerico") + " " + e.message);
            btn.disabled = false; btn.textContent = t("minhaConta.guardar");
          });
        }

        function finalizar() {
          try {
            window.localStorage.setItem("rs:activeAccount", JSON.stringify({ userId: conta.userId, label: novoUsuario, email: novoEmail }));
          } catch (e) {}
          RS.closeModal();
          RS.toast(t("minhaConta.sucesso"));
        }

        if (Object.keys(updates).length > 0) {
          client.auth.updateUser(updates).then((res) => {
            if (res.error) {
              mostrarErro(t("minhaConta.erro.falhaConta") + " (" + res.error.message + ").");
              btn.disabled = false; btn.textContent = t("minhaConta.guardar");
              return;
            }
            atualizarPerfilEFinalizar();
          }).catch((e) => {
            mostrarErro(t("minhaConta.erro.redeGenerico") + " " + e.message);
            btn.disabled = false; btn.textContent = t("minhaConta.guardar");
          });
        } else {
          atualizarPerfilEFinalizar();
        }
      }, () => {
        mostrarErro(t("minhaConta.erro.semInternet"));
        btn.disabled = false; btn.textContent = t("minhaConta.guardar");
      });
    });
  }

  function renderUsage(el) {
    if (!el) return;
    const u = storage.usage();
    const kb = (u.bytes / 1024).toFixed(0);
    const limitMb = (u.limit / (1024 * 1024)).toFixed(0);
    const pct = u.percent;
    const color = pct > 85 ? "#D64545" : pct > 60 ? "var(--rs-yellow)" : "var(--rs-blue)";
    el.innerHTML = `
      <div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--rs-ink-soft); margin-bottom:6px;">
        <span data-i18n="config.espacoUsado">${RS.I18n.t("config.espacoUsado")}</span><span>${kb} KB de ~${limitMb} MB (${pct.toFixed(1)}%)</span>
      </div>
      <div style="height:8px; border-radius:99px; background:var(--rs-gray-light); overflow:hidden;">
        <div style="height:100%; width:${Math.max(2, pct)}%; background:${color}; border-radius:99px;"></div>
      </div>
      ${pct > 85 ? `<p style="font-size:11.5px; color:#D64545; margin-top:8px;">${RS.I18n.t("config.espacoQuaseCheio")}</p>` : ""}
    `;
  }

  function swatch(color, selected) {
    const map = { blue: "var(--rs-blue)", pink: "var(--rs-pink)", yellow: "var(--rs-yellow)", lilac: "var(--rs-lilac)" };
    return `<div data-swatch="${color}" ${selected ? 'data-selected="1"' : ""} style="width:32px; height:32px; border-radius:50%; background:${map[color]}; cursor:pointer; outline:${selected ? "2px solid var(--rs-ink)" : "none"}; outline-offset:2px;"></div>`;
  }

  function renderChipList(el, items, onChange) {
    el.innerHTML = (items || [])
      .map((t, i) => `<span class="rs-badge rs-badge-gray" style="margin:0 6px 6px 0; padding:6px 10px; cursor:default;">${util.escapeHtml(t)} <span data-remove="${i}" style="cursor:pointer; margin-left:4px;">✕</span></span>`)
      .join("");
    el.querySelectorAll("[data-remove]").forEach((btn) =>
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.remove);
        const next = items.slice();
        next.splice(idx, 1);
        onChange(next);
        renderChipList(el, next, onChange);
      })
    );
  }

  function addChip(container, inputSel, key, listSel) {
    const input = container.querySelector(inputSel);
    const val = input.value.trim();
    if (!val) return;
    const cfg = RS.config;
    const next = (cfg[key] || []).concat(val);
    cfg.save({ [key]: next });
    input.value = "";
    renderChipList(container.querySelector(listSel), next, (list) => cfg.save({ [key]: list }));
  }

  RS.modules = RS.modules || {};
  RS.modules.configuracoes = { id: "configuracoes", i18nKey: "nav.configuracoes", i18nSubtitleKey: "shell.configuracoes.subtitulo", get label() { return RS.I18n.t("nav.configuracoes"); }, get subtitle() { return RS.I18n.t("shell.configuracoes.subtitulo"); }, render };
})(window);

</script>
</body>
</html>
